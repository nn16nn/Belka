name: Build Android AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Restore upload key
        env:
          BELKA_KEYSTORE_B64: ${{ secrets.BELKA_KEYSTORE_B64 }}
          BELKA_KEYSTORE_PASSWORD: ${{ secrets.BELKA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$BELKA_KEYSTORE_B64" ]; then echo "::error::Add the BELKA_KEYSTORE_B64 secret"; exit 1; fi
          set +e
          mkdir -p signing
          CLEAN=$(printf %s "$BELKA_KEYSTORE_B64" | tr -d ' \r\n\t')
          printf %s "$CLEAN" | base64 -d > signing/upload.jks 2>/tmp/b64err
          echo "::warning::b64len=${#CLEAN} pwlen=${#BELKA_KEYSTORE_PASSWORD} keysha=$(sha256sum signing/upload.jks | cut -c1-12) b64err=$(head -c 80 /tmp/b64err)"
          keytool -list -keystore signing/upload.jks -storepass "$BELKA_KEYSTORE_PASSWORD" >/tmp/kt 2>&1 || { echo "::error::keytool: $(grep -i error /tmp/kt | head -1)"; exit 1; }
      - name: Build signed release bundle
        working-directory: android
        env:
          BELKA_KEYSTORE: ${{ github.workspace }}/signing/upload.jks
          BELKA_KEYSTORE_PASSWORD: ${{ secrets.BELKA_KEYSTORE_PASSWORD }}
          BELKA_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$BELKA_KEYSTORE_PASSWORD" ]; then echo "::error::Add the BELKA_KEYSTORE_PASSWORD secret in Settings → Secrets and variables → Actions"; exit 1; fi
          chmod +x gradlew
          set +e
          ./gradlew bundleRelease --no-daemon --stacktrace > /tmp/g.log 2>&1
          st=$?
          tail -60 /tmp/g.log
          if [ $st -ne 0 ]; then { sed -n '/FAILURE/,/Try:/p' /tmp/g.log; grep -m5 -B2 -A3 "Value is null" /tmp/g.log; grep -m3 -iE "e: |error:" /tmp/g.log; } | grep -v "^\s*$" | head -40 | while IFS= read -r l; do echo "::error::${l:0:300}"; done; exit $st; fi
      - uses: actions/upload-artifact@v4
        with:
          name: belka-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
