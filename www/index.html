<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1822">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Белка Үстелі</title>

<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  color-scheme:dark;
  --bg:#0a1822;--felt:#12384a;--felt-2:#0c2735;--line:rgba(215,163,75,.18);
  --ivory:#f2ebdc;--ivory-2:#e2d7bf;--ink:#1b232c;--crim:#b0303e;
  --gold:#d6a34c;--gold-2:#f1cb80;--text:#eaf0f2;--muted:#8ea8b3;--panel:rgba(8,22,31,.72);
  --back:#173d5c;
  --cw:clamp(54px,16.8vw,94px);--ch:calc(var(--cw)*1.42);
  --tw:calc(var(--cw)*.84);--th:calc(var(--tw)*1.42);
  --display:"Unbounded",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.sv{fill:currentColor;display:block}

/* ---------- app shell ---------- */
.app{height:100%;max-width:1080px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column;gap:8px;padding-block:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:15px;display:flex;align-items:center;gap:8px}
.brand i{width:8px;height:8px;background:var(--gold);transform:rotate(45deg);display:inline-block}
.tools{display:flex;gap:6px}
.ibtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,transform .12s}
.ibtn:hover{background:rgba(255,255,255,.09)}
.ibtn:active{transform:scale(.97)}
.ibtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ---------- score strip ---------- */
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch}
.team{min-width:0;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;row-gap:2px;align-items:center}
.team.t1{grid-template-columns:1fr auto;text-align:right}
.team.t1 .eyes{grid-column:2;grid-row:1/3}
.team.t1 .tl,.team.t1 .tp{grid-column:1;justify-content:flex-end}
.eyes{grid-row:1/3;display:flex;gap:3px}
.six{width:30px;height:44px;overflow:visible;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.six .cov{filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.tl{display:flex;align-items:center;gap:6px;min-width:0}
.tn{font-family:var(--display);font-weight:700;font-size:13px}
.tag{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--bg);background:var(--gold);border-radius:4px;padding:2px 5px}
.tp{display:flex;align-items:baseline;gap:5px;font-variant-numeric:tabular-nums}
.tp b{font-family:var(--mono);font-size:18px;font-weight:700}
.tp small{font-size:11px;color:var(--muted)}
.tp em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--gold-2)}
.trump{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:14px;background:linear-gradient(180deg,rgba(214,163,76,.16),rgba(214,163,76,.05));border:1px solid rgba(214,163,76,.35)}
.tsuit{width:38px;height:38px;border-radius:10px;background:var(--ivory);display:grid;place-items:center;color:var(--ink)}
.tsuit.red{color:var(--crim)}
.tsuit svg{width:24px;height:24px}
.tinfo{display:flex;flex-direction:column;line-height:1.15}
.tinfo small{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-2);font-weight:700}
.tinfo b{font-size:13px;font-weight:700}
.tinfo span{white-space:nowrap;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- table ---------- */
.table{flex:1;min-height:0;position:relative;border-radius:28px;
  background:
    radial-gradient(120% 90% at 50% 45%,rgba(255,255,255,.07),transparent 60%),
    repeating-linear-gradient(45deg,rgba(214,163,76,.035) 0 1px,transparent 1px 22px),
    repeating-linear-gradient(-45deg,rgba(214,163,76,.035) 0 1px,transparent 1px 22px),
    linear-gradient(180deg,var(--felt),var(--felt-2));
  box-shadow:inset 0 0 0 1px var(--line),inset 0 0 0 7px rgba(0,0,0,.18),inset 0 0 0 8px var(--line),inset 0 30px 60px rgba(0,0,0,.25),0 18px 40px -20px rgba(0,0,0,.8)}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:2}
.s2{top:12px;left:50%;transform:translateX(-50%)}
.s1{left:10px;top:50%;transform:translateY(-50%)}
.s3{right:10px;top:50%;transform:translateY(-50%)}
.ava{width:48px;height:48px;border-radius:50%;position:relative;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.ava>svg{display:block;width:100%;height:100%}
.jtag{position:absolute;right:-12px;bottom:-5px;display:inline-flex;align-items:center;gap:1px;height:20px;padding:0 6px 0 4px;border-radius:999px;background:linear-gradient(180deg,#fbe3a6,#d6a34c);color:#1a1408;font-family:var(--display);font-weight:800;font-size:11px;box-shadow:0 0 0 1.5px #0b2230,0 4px 10px rgba(0,0,0,.5)}
.jtag svg{width:11px;height:11px}
.ava::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent;transition:border-color .25s}
.seat.turn .ava::after{border-color:var(--gold);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.55}}
.nm{font-size:11.5px;font-weight:700;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:999px;white-space:nowrap}
.nm small{color:var(--muted);font-weight:600}
.backs{display:flex;height:22px}
.mb{width:15px;height:22px;border-radius:3px;margin-left:-9px;background:
  repeating-linear-gradient(45deg,rgba(241,203,128,.4) 0 1px,transparent 1px 4px),var(--back);box-shadow:0 0 0 1px var(--ivory)}
.mb:first-child{margin-left:0}
.jbadge{position:absolute;right:-6px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--ivory);color:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 2px var(--gold)}
.jbadge svg{width:11px;height:11px}

.center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}
@media (max-width:760px){.center{top:112px;bottom:10px}}
#trick{position:relative;width:calc(var(--tw)*3.05);height:calc(var(--th)*2.2)}
.toast{position:absolute;left:50%;top:calc(50% - var(--th)*1.1 - 46px);transform:translateX(-50%);background:rgba(8,20,28,.86);border:1px solid rgba(214,163,76,.4);padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .3s,transform .3s;z-index:5;display:flex;align-items:center;gap:6px;max-width:calc(100% - 24px)}
.toast.show{opacity:1}
.toast svg{width:14px;height:14px}
.toast .red{color:#e0606c}

/* ---------- cards ---------- */
.card{width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.08);background:transparent;color:var(--ink);position:relative;border:0;padding:0;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 0 0 1px rgba(27,35,44,.18),0 6px 14px -6px rgba(0,0,0,.55);flex:none}
.card.red{color:var(--crim)}
.card>svg{display:block;width:100%;height:100%}
.card svg text{font-family:var(--display);font-weight:700}
.card.old::before{content:"";position:absolute;inset:calc(var(--cw)*.075);border:1px solid currentColor;opacity:.14;border-radius:calc(var(--cw)*.06)}
.card.old.jack::before{border:1.5px solid var(--gold);opacity:.9;box-shadow:inset 0 0 0 2px rgba(214,163,76,.18)}
.ci{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1}
.ci b{font-family:var(--display);font-weight:700;font-size:calc(var(--cw)*.24);letter-spacing:-.04em}
.ci svg{width:calc(var(--cw)*.17);height:calc(var(--cw)*.17);margin-top:2px}
.tl{top:calc(var(--cw)*.1);left:calc(var(--cw)*.1)}
.card .ci.tl{top:calc(var(--cw)*.1);left:calc(var(--cw)*.1)}
.br{bottom:calc(var(--cw)*.1);right:calc(var(--cw)*.1);transform:rotate(180deg)}
.cc{position:absolute;inset:0;display:grid;place-items:center}
.cc .big{width:calc(var(--cw)*.46);height:calc(var(--cw)*.46)}
.cc.face{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cc .mono{font-family:var(--display);font-weight:800;font-size:calc(var(--cw)*.44);line-height:1;letter-spacing:-.04em}
.cc .cs{width:calc(var(--cw)*.2);height:calc(var(--cw)*.2)}
.card.jack .mono{color:var(--ink);text-shadow:0 1px 0 var(--gold-2)}
.card.red.jack .mono{color:var(--crim)}

/* ---------- hand ---------- */
.me{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.mebar{display:flex;align-items:center;gap:10px;min-height:26px}
.mebar .nm{font-size:12px}
.me.turn .mebar .nm{background:var(--gold);color:var(--bg)}
.me.turn .mebar .nm small{color:rgba(10,24,34,.7)}
.status{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
.status svg{width:13px;height:13px}
.hand{display:flex;justify-content:center;padding-top:18px;padding-bottom:22px;min-height:calc(var(--ch) + 22px)}
.hand .card{margin-left:calc(var(--cw)*-.4);cursor:default;transform-origin:50% 120%;
  transform:translateY(calc(var(--y,0px) + var(--lift,0px))) rotate(var(--rot,0deg));
  transition:transform .28s cubic-bezier(.2,.9,.25,1.2),filter .2s;animation:deal .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*55ms)}
.hand .card:first-child{margin-left:0}
.hand .card.ok{cursor:pointer}
.hand .card.ok:hover,.hand .card.ok:focus-visible{--lift:-16px}
.hand .card.ok:active{--lift:-10px}
.hand .card.off{filter:brightness(.55) saturate(.6)}
@keyframes deal{from{opacity:0;transform:translateY(60px) rotate(0)}}

/* trick */
.tc{position:absolute;width:var(--tw);height:var(--th);transform:rotate(var(--rot));animation:fly .38s cubic-bezier(.2,.8,.2,1) both;
  --cw:var(--tw)}
.tc.static{animation:none}
.p0{left:50%;bottom:0;margin-left:calc(var(--tw)/-2);--fx:0px;--fy:180px}
.p2{left:50%;top:0;margin-left:calc(var(--tw)/-2);--fx:0px;--fy:-180px}
.p1{left:0;top:50%;margin-top:calc(var(--th)/-2);--fx:-180px;--fy:0px}
.p3{right:0;top:50%;margin-top:calc(var(--th)/-2);--fx:180px;--fy:0px}
@keyframes fly{from{transform:translate(var(--fx),var(--fy)) scale(.85);opacity:0}to{transform:rotate(var(--rot));opacity:1}}
#trick.collect .tc{animation:none;transition:transform .45s cubic-bezier(.5,0,.8,.4),opacity .45s;transform:translate(var(--cx),var(--cy)) scale(.4);opacity:0}
.tc.win{box-shadow:0 0 0 2px var(--gold),0 10px 24px -6px rgba(0,0,0,.6)}

/* ---------- overlays ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(4,12,18,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s ease both}
@keyframes fade{from{opacity:0}}
.panel{width:min(440px,100%);max-height:calc(100% - 16px);overflow:auto;background:linear-gradient(180deg,#132d3c,#0d2230);border:1px solid rgba(214,163,76,.28);border-radius:22px;padding:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 30px 60px -20px rgba(0,0,0,.8);animation:rise .4s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes rise{from{transform:translateY(20px) scale(.97);opacity:0}}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2);font-weight:700}
.panel h2{font-family:var(--display);font-weight:700;font-size:22px;margin:6px 0 12px;text-wrap:balance;letter-spacing:-.01em}
.panel p{color:#c3d1d7;line-height:1.55;font-size:14px;margin:0 0 10px}
.split{margin:14px 0 6px}
.bar{height:12px;border-radius:999px;background:#3a5361;position:relative;overflow:hidden;display:flex}
.bar span{height:100%}
.bar .a{background:var(--gold)}
.bar .b{background:#6d8795}
.bar i{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ivory);opacity:.8}
.bar-l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;margin-top:6px;color:#c3d1d7;font-variant-numeric:tabular-nums}
.bar-l b{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:14px;border:0;font-weight:700;font-size:15px;cursor:pointer;transition:transform .12s,filter .2s}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1a1408;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px -8px rgba(214,163,76,.6)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row .btn{flex:1 1 130px;white-space:nowrap}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:13.5px;line-height:1.5;color:#c3d1d7}
.rules li b{color:var(--text)}
.rules .k{width:22px;height:22px;border-radius:6px;background:rgba(214,163,76,.15);color:var(--gold-2);display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;margin-top:1px}
.opts{display:grid;gap:14px;margin:4px 0 4px}
.og{display:grid;gap:7px}
.og-t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg.three{grid-template-columns:1fr 1fr 1fr}.seg.three label{flex-direction:column;align-items:flex-start;gap:6px}
.seg label{position:relative;display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);cursor:pointer;font-size:13px;font-weight:600;line-height:1.3;transition:border-color .2s,background .2s}
.seg input{position:absolute;opacity:0;pointer-events:none}
.ico{flex:none;position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--gold-2);
  background:radial-gradient(90% 70% at 30% 15%,rgba(255,255,255,.1),transparent 60%),linear-gradient(160deg,#1f4a5d,#0b2230 75%);
  box-shadow:inset 0 0 0 1px rgba(241,203,128,.34),inset 0 1px 0 rgba(255,255,255,.12),inset 0 -6px 12px rgba(0,0,0,.35),0 6px 14px -6px rgba(0,0,0,.7);transition:box-shadow .25s,transform .2s}
.ico svg{width:30px;height:30px;overflow:visible}
.ico svg .t{font-family:var(--mono);font-weight:700;fill:url(#icoGold);stroke:none;text-anchor:middle}
.ico svg .d{font-family:var(--display);font-weight:800;fill:url(#icoGold);stroke:none;text-anchor:middle}
.ico .no{position:absolute;right:-5px;top:-5px;width:17px;height:17px;border-radius:6px;background:#0d2230;box-shadow:0 0 0 1px rgba(214,163,76,.4);font-family:var(--mono);font-size:9.5px;font-weight:700;display:grid;place-items:center;color:var(--muted)}
.seg input:checked+.ico{background:radial-gradient(90% 70% at 30% 15%,rgba(255,240,200,.22),transparent 60%),linear-gradient(160deg,#2c6177,#0f3040 75%);box-shadow:inset 0 0 0 1.5px #f1cb80,inset 0 1px 0 rgba(255,255,255,.2),0 0 0 3px rgba(214,163,76,.18),0 10px 22px -8px rgba(214,163,76,.65);transform:translateY(-1px)}
.seg input:checked+.ico .no{color:var(--gold-2)}
.seg .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.seg .tx small{font-size:11px;font-weight:500;color:var(--muted)}
.seg label:has(input:checked){border-color:rgba(214,163,76,.7);background:rgba(214,163,76,.1)}
.seg label:has(input:focus-visible){outline:2px solid var(--gold-2);outline-offset:2px}
.brk{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px;font-size:13.5px;color:#c3d1d7}
.brk li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed rgba(255,255,255,.08);padding-bottom:4px}
.brk li b{font-family:var(--mono);color:var(--gold-2)}
.rlist{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:10px}
.rlist li{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}
/* result */
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin:4px 0 12px}
.side{border-radius:16px;padding:12px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);display:flex;flex-direction:column;gap:4px;min-width:0}
.side.won{background:linear-gradient(180deg,rgba(241,203,128,.14),rgba(214,163,76,.03));box-shadow:inset 0 0 0 1px rgba(214,163,76,.55)}
.side .sn{font-family:var(--display);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.side.won .sn::after{content:attr(data-won);font-family:var(--body);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;background:var(--gold);color:#1a1408;border-radius:4px;padding:2px 5px}
.side .big{font-family:var(--mono);font-weight:700;font-size:38px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.side.won .big{color:var(--gold-2)}
.side .sub{font-size:11.5px;color:var(--muted)}
.mcs{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.mc{display:inline-flex;align-items:center;gap:1px;height:20px;padding:0 4px;border-radius:5px;background:var(--ivory);color:var(--ink);font-family:var(--display);font-weight:700;font-size:10px;opacity:0;animation:mcin .3s ease both;animation-delay:calc(var(--i)*35ms + 250ms)}
.mc.red{color:var(--crim)}
.mc svg{width:9px;height:9px}
@keyframes mcin{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.vs{align-self:center;display:flex;flex-direction:column;align-items:center;font-family:var(--mono);font-size:10px;color:var(--muted);gap:2px}
.vs b{font-size:15px;color:var(--text)}
.bar span{transition:width 1s cubic-bezier(.2,.8,.2,1)}
.brk li{align-items:center}
.brk .ico{width:30px;height:30px;border-radius:9px}
.brk .ico svg{width:22px;height:22px}
.brk li>span{display:flex;align-items:center;gap:10px}
.eyerow{display:flex;justify-content:space-between;align-items:center;margin:12px 0 2px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.18)}
.eyerow .eg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.eyerow .eg b{color:var(--text);font-size:14px}
.six.lg{width:61px;height:90px}
.six .cov.slide{transform-box:view-box;transform-origin:50px 70px;animation:covslide .9s cubic-bezier(.45,0,.2,1) both}
@keyframes covslide{from{transform:translate(var(--fx),var(--fy)) rotate(var(--fa))}to{transform:translate(var(--tx),var(--ty)) rotate(var(--ta))}}
.hw{color:var(--gold-2)}.hl{color:#ef8a94}
.jrow{display:flex;gap:6px;margin:4px 0 14px;--cw:46px;--ch:65px}

/* ---------- title ---------- */
.title{position:fixed;inset:0;z-index:30;overflow:auto;background:
  radial-gradient(80% 60% at 78% 40%,rgba(28,78,102,.55),transparent 70%),
  repeating-linear-gradient(45deg,rgba(214,163,76,.03) 0 1px,transparent 1px 26px),
  repeating-linear-gradient(-45deg,rgba(214,163,76,.03) 0 1px,transparent 1px 26px),var(--bg)}

.fx{position:fixed;inset:0;z-index:60;backdrop-filter:blur(8px) saturate(.7);-webkit-backdrop-filter:blur(8px) saturate(.7);display:grid;place-items:center;overflow:hidden;cursor:pointer;animation:fade .3s both;-webkit-user-select:none;user-select:none}

.fx.egg{background:radial-gradient(55% 45% at 50% 42%,rgba(92,70,34,.92),rgba(9,20,28,.97) 72%)}
.rays{position:absolute;left:50%;top:40%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(rgba(241,203,128,.16) 0deg 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 6%,transparent 42%);mask-image:radial-gradient(circle,#000 6%,transparent 42%);animation:spin 22s linear infinite}

@keyframes slam{from{transform:scale(3.4) rotate(-6deg);opacity:0}}
.ring{position:absolute;left:50%;top:44%;width:44px;height:44px;margin:-22px;border-radius:50%;border:3px solid var(--gold-2);opacity:0;animation:ring 1.3s .42s cubic-bezier(.1,.6,.3,1) both}

function confetti(cv,mode){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce)return()=>{};
  const ctx=cv.getContext('2d');const dpr=Math.min(2,devicePixelRatio||1);
  const W=cv.width=innerWidth*dpr,H=cv.height=innerHeight*dpr;
  const cols=mode==='mock'?['#6d8795','#8ea8b3','#3a5361']:['#f1cb80','#d6a34c','#fff4d2','#b47a26',mode==='naked'?'#e0606c':'#f2ebdc'];
  const P=[];const n=mode==='mock'?40:140;
  for(let i=0;i<n;i++){
    if(mode==='naked'){const a=Math.random()*Math.PI*2,sp=(6+Math.random()*14)*dpr;P.push({x:W/2,y:H*.44,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4*dpr,r:(3+Math.random()*5)*dpr,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,d:.5})}
    else P.push({x:Math.random()*W,y:-Math.random()*H*.8,vx:(Math.random()-.5)*1.5*dpr,vy:(1.5+Math.random()*3)*dpr,r:(2+Math.random()*(mode==='egg'?3.5:5))*dpr,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.2,star:mode==='egg'&&Math.random()<.5})
  }
  let raf,alive=true;
  const draw=()=>{if(!alive)return;ctx.clearRect(0,0,W,H);
    for(const p of P){p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;if(mode==='naked'){p.vx*=.97;p.vy=p.vy*.97+.35*dpr}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
      if(p.star){ctx.beginPath();for(let k=0;k<8;k++){const rr=k%2?p.r*.35:p.r*1.4;ctx.lineTo(Math.cos(k*Math.PI/4)*rr,Math.sin(k*Math.PI/4)*rr)}ctx.fill()}
      else ctx.fillRect(-p.r,-p.r*.45,p.r*2,p.r*.9);
      ctx.restore();if(mode!=='naked'&&p.y>H+20){p.y=-20;p.x=Math.random()*W}}
    raf=requestAnimationFrame(draw)};
  draw();return()=>{alive=false;cancelAnimationFrame(raf)};
}

/* ---------- rules engine ---------- */
const isTrump=c=>c.r==='J'||c.s===G.trump;
const eff=c=>isTrump(c)?'T':c.s;
const power=c=>c.r==='J'?100+JORD[c.s]:(c.s===G.trump?50:0)+ORD[c.r];
function beats(a,b){const ea=eff(a),eb=eff(b);if(ea===eb)return power(a)>power(b);return ea==='T'}
function trickWinner(tr){let best=tr[0];for(const t of tr.slice(1))if(beats(t.card,best.card))best=t;return best.seat}
function legal(hand,tr){if(!tr.length)return hand.slice();const led=eff(tr[0].card);const f=hand.filter(c=>eff(c)===led);if(f.length)return f;
  const rules=(G&&G.rules)||RULES;
  if(rules.ace==='played'){const ok=hand.filter(c=>!(c.r==='A'&&eff(c)!=='T'&&!(G.led||[]).includes(c.s)));if(ok.length)return ok}
  return hand.slice()}
function fullDeck(){const d=[];for(const s of SUITS)for(const r of RANKS)d.push({s,r});return d}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sortHand(h){
  const so={T:0,C:1,H:2,S:3,D:4};
  return h.sort((a,b)=>(so[eff(a)]-so[eff(b)])||(power(b)-power(a)));
}

/* ---------- bots ---------- */
function isTop(c,seat){
  const mine=new Set(G.hands[seat].map(key));
  const onTable=new Set(G.trick.map(t=>key(t.card)));
  return !fullDeck().some(d=>eff(d)===eff(c)&&power(d)>power(c)&&!G.played.includes(key(d))&&!mine.has(key(d))&&!onTable.has(key(d)));
}
function lowest(L){
  const non=L.filter(c=>eff(c)!=='T');const pool=non.length?non:L;
  return pool.slice().sort((a,b)=>(PTS[a.r]-PTS[b.r])||(power(a)-power(b)))[0];
}
function botPick(seat){
  const hand=G.hands[seat],L=legal(hand,G.trick),team=seat%2;
  const byPow=(a,b)=>power(a)-power(b);
  if(!G.trick.length){
    const trumps=hand.filter(c=>eff(c)==='T');
    const topT=trumps.filter(c=>isTop(c,seat)).sort((a,b)=>power(b)-power(a));
    if(team===G.trumpTeam&&trumps.length>=3&&topT.length)return topT[0];
    const aces=hand.filter(c=>eff(c)!=='T'&&c.r==='A');
    if(aces.length)return aces[Math.floor(Math.random()*aces.length)];
    const tops=hand.filter(c=>eff(c)!=='T'&&isTop(c,seat)&&PTS[c.r]>=10);
    if(tops.length)return tops[0];
    if(topT.length&&trumps.length>=4)return topT[0];
    return lowest(hand);
  }
  const ws=trickWinner(G.trick),best=G.trick.find(t=>t.seat===ws).card;
  const last=G.trick.length===3;
  const trickPts=G.trick.reduce((s,t)=>s+PTS[t.card.r],0);
  if(ws%2===team){
    const safe=last||isTop(best,seat)||(G.trick.length===2&&power(best)>=60);
    if(safe){
      const pool=L.slice().sort((a,b)=>(PTS[b.r]-PTS[a.r])||(power(a)-power(b)));
      const non=pool.filter(c=>c.r!=='J'&&!(eff(c)==='T'&&c.r==='A'));
      return (non.length?non:pool)[0];
    }
    return lowest(L);
  }
  const winners=L.filter(c=>beats(c,best)).sort(byPow);
  if(winners.length){
    const cheap=winners[0];
    if(last)return cheap;
    if(trickPts>=10)return isTop(winners[winners.length-1],seat)?winners[winners.length-1]:cheap;
    if(eff(cheap)!=='T'&&isTop(cheap,seat))return cheap;
    if(eff(cheap)!=='T'&&PTS[cheap.r]>=10)return cheap;
    if(trickPts>=3)return cheap;
  }
  return lowest(L);
}

}
let toastT;
function toast(html,ms=2600){const t=$('#toast');t.innerHTML=html;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms)}

/* ---------- flow ---------- */
function newGame(){
  clearTimers();
  G={rules:{...RULES},eyes:[0,0],deal:0,dealer:Math.floor(Math.random()*4),seatSuit:null,bonus:0,phase:'play',hands:[[],[],[],[]],trick:[],played:[],leader:0,turn:0,pts:[0,0],trump:'C',trumpTeam:0,jcHolder:0,lock:false,fresh:true,result:null};
  $('#title').hidden=true;closeSheet();
  startDeal();
}
function startDeal(){
  G.deal++;G.dealer=(G.dealer+1)%4;
  const d=shuffle(fullDeck());
  G.hands=[0,1,2,3].map(i=>d.slice(i*8,i*8+8));
  const rd=checkRedeal();
  if(rd){G.deal--;G.dealer=(G.dealer+3)%4;G.phase='redeal';G.redeal=rd;G.trick=[];G.fresh=true;
    G.jcHolder=-1;rebuildTrick();renderAll();sfx.shuffle();later(showRedeal,500);return}
  sfx.deal();
  const holder=G.hands.findIndex(h=>h.some(c=>c.s==='C'&&c.r==='J'));
  if(!G.seatSuit){G.seatSuit={};G.firstHolder=holder;['C','H','S','D'].forEach((s,k)=>G.seatSuit[(holder+k)%4]=s)}
  G.trump=G.seatSuit[holder];G.trumpTeam=G.deal===1?-1:holder%2;G.jcHolder=G.deal===1?-1:holder;
  G.hands[0]=sortHand(G.hands[0]);
  G.pts=[0,0];G.tk=[0,0];G.won=[[],[]];G.led=[];G.trick=[];G.played=[];G.phase='play';G.lock=false;G.fresh=true;G.result=null;
  G.leader=(G.dealer+1)%4;G.turn=G.leader;
  rebuildTrick();renderAll();
  const r=RED(G.trump)?' class="red"':'';
  if(G.deal===1){toast(t('deal1Toast',svg('C')),3200);later(next,900);return}
  toast(t('jackToast',LOC[holder],svg('C')+LABEL.J,`<span${r} style="display:inline-flex">${svg(G.trump)}</span>`,SNAME[G.trump]),3200);
  later(next,900);
}
function showReveal(){
  const h=G.firstHolder;
  const rel=s=>s===h?'треф балтасы':s===(h+2)%4?'серіктесі':s===(h+1)%4?'сол жағы':'оң жағы';
  const rows=[0,1,2,3].map(s=>`<div class="rv${G.seatSuit[s]===G.trump?' on':''}"><span class="rv-s${RED(G.seatSuit[s])?' red':''}">${svg(G.seatSuit[s])}</span><b>${NAMES[s]}</b><small>${rel(s)}</small></div>`).join('');
  openSheet(`<div class="eyebrow">2-тарату · түстер бекітілді</div><h2>1-таратуда треф балтасы ${LOC[h]} болды</h2>
   <p>Енді әр орынның өз түсі бар. Треф балтасы кімге түссе, көзір — сол орынның түсі.</p>
   <div class="rvs">${rows}</div>
   <div class="big-reason">${icon('trump')}<div><b>${SNAME[G.trump]}</b><br><span>Бұл таратуда треф балтасы ${LOC[G.jcHolder]}. Көзір — ${SNAME[G.trump].toLowerCase()}.</span></div></div>
   <div class="row"><button class="btn gold" data-act="reveal-go">Ойнау</button></div>`);
}
function checkRedeal(){
  for(let s=0;s<4;s++){if(G.hands[s].filter(c=>c.r==='J').length===4)return{seat:s,kind:'jacks',cards:G.hands[s].map(key)}}
  for(let s=0;s<4;s++){const p=G.hands[s].reduce((a,c)=>a+PTS[c.r],0);if(p<10)return{seat:s,kind:'low',pts:p,cards:G.hands[s].map(key)}}
  return null;
}
function showRedeal(){
  const r=G.redeal;if(!r)return;
  const who=LOC[r.seat];
  const cards=r.cards.slice().sort((a,b)=>PTS[b.slice(1)]-PTS[a.slice(1)]).map((k,i)=>miniCard(k,i).replace('class="mc','class="mc'+((r.kind==='jacks'&&k.slice(1)==='J')||(r.kind==='low'&&PTS[k.slice(1)]>0)?' hl':''))).join('');
  const reason=r.kind==='jacks'
    ?`<div class="big-reason">${icon('jacks')}<div><b>${t('fourJacks')}</b><br><span>${t('fourJacksTxt',who)}</span></div></div>`
    :`<div class="big-reason">${icon('low')}<div><b>${t('pts',r.pts)}</b><br><span>${t('lowTxt',who)}</span></div></div>`;
  openSheet(`<div class="eyebrow">${t('redeal')}</div><h2>${r.kind==='jacks'?t('redealJacks'):t('redealLow')}</h2>${reason}<div class="og-t" style="margin-bottom:6px">${GEN[r.seat]}</div><div class="redeal-hand">${cards}</div><div class="row"><button class="btn gold" data-act="redeal">${t('redeal')}</button></div>`);
}
function next(){
  renderSeats();renderHand();
  if(G.phase!=='play')return;
  if(G.turn!==0){const s=G.turn;later(()=>{if(G.phase==='play'&&G.turn===s)playCard(s,botPick(s))},560+Math.random()*420)}
}
function humanPlay(c){
  if(G.phase!=='play'||G.turn!==0||G.lock||G.trick.length>=4)return;
  if(!legal(G.hands[0],G.trick).includes(c))return;
  playCard(0,c);
}
function playCard(seat,c){
  const h=G.hands[seat];const i=h.findIndex(x=>key(x)===key(c));if(i<0)return;
  h.splice(i,1);
  const rot=+(Math.random()*12-6).toFixed(1);
  if(!G.trick.length&&eff(c)!=='T'&&!G.led.includes(c.s))G.led.push(c.s);
  G.trick.push({seat,card:c,rot});sfx.card();G.played.push(key(c));
  addTrickCard(seat,c,true,rot);
  if(G.trick.length===4){G.lock=true;renderSeats();renderHand();later(finishTrick,950);return}
  G.turn=(seat+1)%4;next();
}
function finishTrick(){
  const w=trickWinner(G.trick);
  const pts=G.trick.reduce((s,t)=>s+PTS[t.card.r],0);
  const idx=G.trick.findIndex(t=>t.seat===w);
  const t=$('#trick');
  t.children[idx]&&t.children[idx].classList.add('win');
  const dir={0:['0px','260px'],1:['-260px','0px'],2:['0px','-260px'],3:['260px','0px']}[w];
  later(()=>{
    t.style.setProperty('--cx',dir[0]);t.style.setProperty('--cy',dir[1]);t.classList.add('collect');
    G.pts[w%2]+=pts;G.tk[w%2]++;G.won[w%2].push(...G.trick.map(x=>x.card));renderScore();
  },420);
  later(()=>{
    G.trick=[];rebuildTrick();G.lock=false;G.leader=w;G.turn=w;
    if(G.hands.every(h=>!h.length))endDeal();else next();
  },950);
}
function endDeal(){
  const [a,b]=G.pts;const RU=G.rules;let res;const prev=[...G.eyes];
  if(a===60&&b===60){G.bonus=RU.egg;res={kind:'eggs'}}
  else{
    const w=a>60?0:1,l=1-w;
    const naked=G.pts[w]===120;
    const parts=[];
    if(naked&&RU.naked==='win'){G.eyes[w]=12;parts.push([t('p_nakedFin'),12-prev[w],'nakedFin']);res={kind:'win',w,e:12-prev[w],parts,instant:true}}
    else{
      if(G.deal===1)parts.push([t('p_deal1'),2,'hidden']);
      else{parts.push([t('p_win'),1,'win1']);if(G.trumpTeam!==w)parts.push([t(G.trumpTeam===0?'p_trumpUs':'p_trumpThem'),1,'trump'])}
      if(naked)parts.push([t('p_naked'),4,'naked4']);
      else if(G.deal>1&&RU.save!=='none'&&G.pts[l]<RU.save)parts.push([t('p_save',G.pts[l],RU.save),1,RU.save===30?'save30':'save31']);
      let e=parts.reduce((s,p)=>s+p[1],0);
      if(G.bonus==='plus4'){parts.push([t('p_egg4'),4,'egg4']);e+=4}
      else if(G.bonus==='x2'){parts.push([t('p_egg2'),e,'egg2']);e*=2}
      G.eyes[w]=Math.min(12,G.eyes[w]+e);
      res={kind:'win',w,e,parts};
    }
    G.bonus=0;
  }
  res.naked=res.kind==='win'&&G.pts[res.w]===120;
  res.pts=[a,b];res.deal=G.deal;res.prev=prev;res.tk=[...G.tk];
  res.won=G.won.map(arr=>arr.filter(c=>PTS[c.r]>0).sort((x,y)=>PTS[y.r]-PTS[x.r]||JORD[x.s]-JORD[y.s]).map(key));
  G.result=res;
  G.phase=(G.eyes[0]>=12||G.eyes[1]>=12)?'over':'result';
  renderAll();
  if(G.phase==='over'){const s=getStats();G.eyes[0]>=12?s.w++:s.l++;setStats(s);G.result.rating=applyRating(G.eyes[0]>=12)}
  later(afterDeal,600);
}
async function afterDeal(){
  const r=G.result;if(!r)return;
  if(r.kind==='eggs')await fx('egg',{text:t('eggFx',G.bonus==='x2'?t('eggFxX2'):t('eggFx4'))});
  else if(r.naked){const us=r.w===0;await fx('naked',{lost:!us,team:us?t('nakedUs'):t('nakedThem'),a:r.pts[0],b:r.pts[1],
    text:(us?t('nakedUsTxt'):t('nakedThemTxt'))+(r.instant?t('gameOverShort'):(us?t('plus4Us'):t('plus4Them')))})}
  if(G.phase==='over'){const l=G.eyes[0]>=12?1:0;if(G.eyes[l]===0)await fx('mock',{text:l===0?t('blindUs'):t('blindThem')})}
  if(G&&G.result===r)showResult();
}
function miniCard(k,i){const c={s:k[0],r:k.slice(1)};return `<span class="mc${RED(c.s)?' red':''}" style="--i:${i}">${LABEL[c.r]}${svg(c.s)}</span>`}
function showResult(){
  const r=G.result;if(!r)return;
  const over=G.phase==='over';
  const [a,b]=r.pts;
  const w=r.kind==='win'?r.w:-1;
  let head,why;
  if(r.kind==='eggs'){head=t('eggsHead');why=`<ul class="brk"><li><span>${icon(G.bonus==='x2'?'egg2':'egg4')}${t('nextDeal',G.bonus==='x2'?t('x2'):t('p4'))}</span><b>—</b></li></ul>`}
  else{
    head=r.instant?(w===0?t('winNaked'):t('lossNaked')):(w===0?t('winHead',r.e):t('lossHead',r.e));
    why=`<ul class="brk">${r.parts.map(p=>`<li><span>${icon(p[2])}${p[0]}</span><b>+${p[1]}</b></li>`).join('')}</ul>`;
  }
  const side=(tm,pts)=>`<div class="side${w===tm?' won':''}"><div class="sn" data-won="${t('won')}">${TEAM[tm]}</div><div class="big" data-count="${pts}">0</div><div class="sub">${t('sideSub',r.tk[tm])}</div><div class="mcs">${r.won[tm].map(miniCard).join('')}</div></div>`;
  const eyes=t=>{const e=G.eyes[t],p=r.prev[t];return `<div class="eg">${t===1?`<b>${e}</b>/12`:''}${sixSVG(e,t,p,'lg',1.1)}${t===0?`<b>${e}</b>/12`:''}</div>`};
  const body=`<div class="eyebrow">${t('dealResult',r.deal)}</div>
   <h2 class="${w===0?'hw':w===1?'hl':''}">${head}</h2>
   <div class="duel">${side(0,a)}<div class="vs"><b>61</b>${t('need')}</div>${side(1,b)}</div>
   <div class="bar"><span class="a" data-w="${a/120*100}" style="width:0"></span><span class="b" data-w="${b/120*100}" style="width:0"></span><i></i></div>
   <div style="height:12px"></div>
   ${why}
   <div class="eyerow">${eyes(0)}<span class="og-t" style="margin:0">${t('eyesWord')}</span>${eyes(1)}</div>`;
  if(over){
    const won=G.eyes[0]>=12;const s=getStats();
    openSheet(body.replace(/<div class="eyebrow">.*?<\/div>\s*<h2>.*?<\/h2>/s,`<div class="eyebrow">${t('gameOver')}</div><h2 class="${won?'hw':'hl'}">${won?t('bigWin'):t('bigLoss')}</h2>`)+`${r.rating?`<div class="rdelta ${r.rating.now>=r.rating.old?'up':'down'}"><span>${t('rating')}</span><b data-count="${r.rating.now}" data-from="${r.rating.old}">${r.rating.old}</b><em>${r.rating.now>=r.rating.old?'+':'−'}${Math.abs(r.rating.now-r.rating.old)}</em>${r.rating.up?`<i>${t('newRank',tierName(tierOf(r.rating.now)))}</i>`:''}</div>`:''}<div class="row"><button class="btn gold" data-act="new">${t('again')}</button><button class="btn ghost" data-act="home">${t('home')}</button></div>`);
  } else {
    openSheet(body+`<div class="row"><button class="btn gold" data-act="next">${t('next')}</button></div>`);
  }
  animateResult();
}
function animateResult(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll('#overlay .bar span[data-w]').forEach(el=>el.style.width=el.dataset.w+'%')}));
  document.querySelectorAll('#overlay [data-count]').forEach(el=>{
    const to=+el.dataset.count;if(reduce){el.textContent=to;return}
    const from=+(el.dataset.from||0),t0=performance.now(),d=1000;
    const step=t=>{const k=Math.min(1,(t-t0)/d);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
function openSheet(inner){
  $('#overlay').innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="panel">${inner}</div></div>`;
  const b=$('#overlay .btn.gold, #overlay .btn');b&&b.focus({preventScroll:true});
}
function closeSheet(){$('#overlay').innerHTML=''}
function showRules(){
  const jr=['C','S','H','D'].map(s=>makeCard({s,r:'J'}).outerHTML).join('');
  openSheet(`<div class="eyebrow">${t('rulesEyebrow')}</div><h2>${t('howTo')}</h2>
  <div class="jrow">${jr}</div>
  <ul class="rules">${t('rulesList').map((x,i)=>`<li><span class="k">${i+1}</span><span>${x}</span></li>`).join('')}</ul>
  <div class="og-t" style="margin:16px 0 8px">${t('curSet')}</div>
  <ul class="rlist">${ruleList(G?G.rules:RULES)}</ul>
  <div class="row"><button class="btn gold" data-act="close">${t('gotIt')}</button></div>`);
}
function showSetup(){
  let num=0;const g=OPTS.map((grp,gi)=>`<div class="og" role="radiogroup" aria-label="${t(grp.t)}"><div class="og-t">${t(grp.t)}</div><div class="seg${grp.o.length>2?' three':''}">${grp.o.map((o,oi)=>`<label><input type="radio" name="r-${grp.k}" id="r-${grp.k}-${oi}" value="${o[0]}" ${RULES[grp.k]===o[0]?'checked':''}>${icon(o[3],++num)}<span class="tx">${t(o[1])}<small>${t(o[2])}</small></span></label>`).join('')}</div></div>`).join('');
  openSheet(`<div class="eyebrow">${t('newParty')}</div><h2>${t('chooseRules')}</h2><div class="opts">${g}</div><div class="row"><button class="btn gold" data-act="go">${t('start')}</button><button class="btn ghost" data-act="close">${t('back')}</button></div>`);
}
function readSetup(){/*v*/
  const r={...RULES};
  for(const grp of OPTS){const el=document.querySelector(`input[name="r-${grp.k}"]:checked`);if(el)r[grp.k]=el.value==='none'?'none':(typeof grp.o[0][0]==='number'?+el.value:el.value)}
  RULES=r;setRules(r);
}
function goHome(){clearTimers();closeSheet();G=null;$('#title').hidden=false;showStats()}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='next'){closeSheet();startDeal()}
  else if(act==='set-save'){const d=document.querySelector('input[name="s-deck"]:checked'),f=document.querySelector('input[name="s-felt"]:checked');const lg=document.querySelector('input[name="s-lang"]:checked');if(d)SET.deck=d.value;if(f)SET.felt=f.value;if(lg)SET.lang=lg.value;applySet();closeSheet();applyLang()}
  else if(act==='new')showSetup();
  else if(act==='reveal-go'){closeSheet();G.phase='play';renderAll();later(next,500)}
  else if(act==='redeal'){closeSheet();G.redeal=null;startDeal()}
  else if(act==='home')goHome();
  else if(act==='close'){closeSheet()}
  else if(act==='confirm-new'){showSetup()}
  else if(act==='go'){readSetup();newGame()}
});
$('#btnStart').addEventListener('click',()=>{ac();showSetup()});
$('#btnSnd').addEventListener('click',()=>{setSnd(!SND.on);if(SND.on){ac();sfx.card()}});
setSnd(SND.on);

$('#btnRules2').addEventListener('click',showRules);

$('#btnSet2').addEventListener('click',showSettings);
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{SET.lang=b.dataset.lang;applySet();applyLang()}));
applySet();setLangData();

  openSheet(`<div class="eyebrow">${t('newParty')}</div><h2>${t('quitQ')}</h2><p>${t('quitTxt')}</p><div class="row"><button class="btn gold" data-act="confirm-new">${t('yesStart')}</button><button class="btn ghost" data-act="close">${t('keepPlaying')}</button></div>`);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').innerHTML&&!$('#overlay [data-act="next"],#overlay [data-act="new"]'))closeSheet()});

/* title fan */
(function(){
  const f=$('#fan');const rots=[-21,-7,7,21];
  ['C','S','H','D'].forEach((s,i)=>{const c=makeCard({s,r:'J'});c.style.setProperty('--r',rots[i]+'deg');c.style.setProperty('--i',i);f.appendChild(c)});
})();

/* hot reload */
function start(data){
  if(data&&data.G){
    G=data.G;$('#title').hidden=true;rebuildTrick();renderAll();
    if(G.phase==='play'){if(G.trick.length===4){later(finishTrick,300)}else next()}
    else if(G.phase==='redeal')showRedeal();
    else if(G.phase==='reveal')showReveal();
    else showResult();
  } else {showStats()}
}
window.claude?.hot?.snapshot?.(()=>({G:G?JSON.parse(JSON.stringify({...G,lock:false})):null}));
applyLang();
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
