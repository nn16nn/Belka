<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1822">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Белка Үстелі</title>
 <link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  color-scheme:dark;
  --bg:#0a1822;--felt:#12384a;--felt-2:#0c2735;--line:rgba(215,163,75,.18);
  --ivory:#f2ebdc;--ivory-2:#e2d7bf;--ink:#1b232c;--crim:#b0303e;
  --gold:#d6a34c;--gold-2:#f1cb80;--text:#eaf0f2;--muted:#8ea8b3;--panel:rgba(8,22,31,.72);
  --back:#173d5c;
  --cw:clamp(54px,16.8vw,94px);--ch:calc(var(--cw)*1.42);
  --tw:calc(var(--cw)*.84);--th:calc(var(--tw)*1.42);
  --display:"Unbounded",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.sv{fill:currentColor;display:block}

/* ---------- app shell ---------- */
.app{height:100%;max-width:1080px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column;gap:8px;padding-block:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:15px;display:flex;align-items:center;gap:8px}
.brand i{width:8px;height:8px;background:var(--gold);transform:rotate(45deg);display:inline-block}
.tools{display:flex;gap:6px}
.ibtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,transform .12s}
.ibtn:hover{background:rgba(255,255,255,.09)}
.ibtn:active{transform:scale(.97)}
.ibtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ---------- score strip ---------- */
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch}
.team{min-width:0;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;row-gap:2px;align-items:center}
.team.t1{grid-template-columns:1fr auto;text-align:right}
.team.t1 .eyes{grid-column:2;grid-row:1/3}
.team.t1 .tl,.team.t1 .tp{grid-column:1;justify-content:flex-end}
.eyes{grid-row:1/3;display:flex;gap:3px}
.six{width:30px;height:44px;overflow:visible;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.six .cov{filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.tl{display:flex;align-items:center;gap:6px;min-width:0}
.tn{font-family:var(--display);font-weight:700;font-size:13px}
.tag{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--bg);background:var(--gold);border-radius:4px;padding:2px 5px}
.tp{display:flex;align-items:baseline;gap:5px;font-variant-numeric:tabular-nums}
.tp b{font-family:var(--mono);font-size:18px;font-weight:700}
.tp small{font-size:11px;color:var(--muted)}
.tp em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--gold-2)}
.trump{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:14px;background:linear-gradient(180deg,rgba(214,163,76,.16),rgba(214,163,76,.05));border:1px solid rgba(214,163,76,.35)}
.tsuit{width:38px;height:38px;border-radius:10px;background:var(--ivory);display:grid;place-items:center;color:var(--ink)}
.tsuit.red{color:var(--crim)}
.tsuit svg{width:24px;height:24px}
.tinfo{display:flex;flex-direction:column;line-height:1.15}
.tinfo small{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-2);font-weight:700}
.tinfo b{font-size:13px;font-weight:700}
.tinfo span{white-space:nowrap;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- table ---------- */
.table{flex:1;min-height:0;position:relative;border-radius:28px;
  background:
    radial-gradient(120% 90% at 50% 45%,rgba(255,255,255,.07),transparent 60%),
    repeating-linear-gradient(45deg,rgba(214,163,76,.035) 0 1px,transparent 1px 22px),
    repeating-linear-gradient(-45deg,rgba(214,163,76,.035) 0 1px,transparent 1px 22px),
    linear-gradient(180deg,var(--felt),var(--felt-2));
  box-shadow:inset 0 0 0 1px var(--line),inset 0 0 0 7px rgba(0,0,0,.18),inset 0 0 0 8px var(--line),inset 0 30px 60px rgba(0,0,0,.25),0 18px 40px -20px rgba(0,0,0,.8)}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:2}
.s2{top:12px;left:50%;transform:translateX(-50%)}
.s1{left:10px;top:50%;transform:translateY(-50%)}
.s3{right:10px;top:50%;transform:translateY(-50%)}
.ava{width:48px;height:48px;border-radius:50%;position:relative;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.ava>svg{display:block;width:100%;height:100%}
.jtag{position:absolute;right:-12px;bottom:-5px;display:inline-flex;align-items:center;gap:1px;height:20px;padding:0 6px 0 4px;border-radius:999px;background:linear-gradient(180deg,#fbe3a6,#d6a34c);color:#1a1408;font-family:var(--display);font-weight:800;font-size:11px;box-shadow:0 0 0 1.5px #0b2230,0 4px 10px rgba(0,0,0,.5)}
.jtag svg{width:11px;height:11px}
.ava::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent;transition:border-color .25s}
.seat.turn .ava::after{border-color:var(--gold);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.55}}
.nm{font-size:11.5px;font-weight:700;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:999px;white-space:nowrap}
.nm small{color:var(--muted);font-weight:600}
.backs{display:flex;height:22px}
.mb{width:15px;height:22px;border-radius:3px;margin-left:-9px;background:
  repeating-linear-gradient(45deg,rgba(241,203,128,.4) 0 1px,transparent 1px 4px),var(--back);box-shadow:0 0 0 1px var(--ivory)}
.mb:first-child{margin-left:0}
.jbadge{position:absolute;right:-6px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--ivory);color:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 2px var(--gold)}
.jbadge svg{width:11px;height:11px}

.center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}
@media (max-width:760px){.center{top:112px;bottom:10px}}
#trick{position:relative;width:calc(var(--tw)*3.05);height:calc(var(--th)*2.2)}
.toast{position:absolute;left:50%;top:calc(50% - var(--th)*1.1 - 46px);transform:translateX(-50%);background:rgba(8,20,28,.86);border:1px solid rgba(214,163,76,.4);padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .3s,transform .3s;z-index:5;display:flex;align-items:center;gap:6px;max-width:calc(100% - 24px)}
.toast.show{opacity:1}
.toast svg{width:14px;height:14px}
.toast .red{color:#e0606c}

/* ---------- cards ---------- */
.card{width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.08);background:transparent;color:var(--ink);position:relative;border:0;padding:0;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 0 0 1px rgba(27,35,44,.18),0 6px 14px -6px rgba(0,0,0,.55);flex:none}
.card.red{color:var(--crim)}
.card>svg{display:block;width:100%;height:100%}
.card svg text{font-family:var(--display);font-weight:700}
.card.old::before{content:"";position:absolute;inset:calc(var(--cw)*.075);border:1px solid currentColor;opacity:.14;border-radius:calc(var(--cw)*.06)}
.card.old.jack::before{border:1.5px solid var(--gold);opacity:.9;box-shadow:inset 0 0 0 2px rgba(214,163,76,.18)}
.ci{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1}
.ci b{font-family:var(--display);font-weight:700;font-size:calc(var(--cw)*.24);letter-spacing:-.04em}
.ci svg{width:calc(var(--cw)*.17);height:calc(var(--cw)*.17);margin-top:2px}
.tl{top:calc(var(--cw)*.1);left:calc(var(--cw)*.1)}
.card .ci.tl{top:calc(var(--cw)*.1);left:calc(var(--cw)*.1)}
.br{bottom:calc(var(--cw)*.1);right:calc(var(--cw)*.1);transform:rotate(180deg)}
.cc{position:absolute;inset:0;display:grid;place-items:center}
.cc .big{width:calc(var(--cw)*.46);height:calc(var(--cw)*.46)}
.cc.face{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cc .mono{font-family:var(--display);font-weight:800;font-size:calc(var(--cw)*.44);line-height:1;letter-spacing:-.04em}
.cc .cs{width:calc(var(--cw)*.2);height:calc(var(--cw)*.2)}
.card.jack .mono{color:var(--ink);text-shadow:0 1px 0 var(--gold-2)}
.card.red.jack .mono{color:var(--crim)}

/* ---------- hand ---------- */
.me{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.mebar{display:flex;align-items:center;gap:10px;min-height:26px}
.mebar .nm{font-size:12px}
.me.turn .mebar .nm{background:var(--gold);color:var(--bg)}
.me.turn .mebar .nm small{color:rgba(10,24,34,.7)}
.status{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
.status svg{width:13px;height:13px}
.hand{display:flex;justify-content:center;padding-top:18px;padding-bottom:22px;min-height:calc(var(--ch) + 22px)}
.hand .card{margin-left:calc(var(--cw)*-.4);cursor:default;transform-origin:50% 120%;
  transform:translateY(calc(var(--y,0px) + var(--lift,0px))) rotate(var(--rot,0deg));
  transition:transform .28s cubic-bezier(.2,.9,.25,1.2),filter .2s;animation:deal .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*55ms)}
.hand .card:first-child{margin-left:0}
.hand .card.ok{cursor:pointer}
.hand .card.ok:hover,.hand .card.ok:focus-visible{--lift:-16px}
.hand .card.ok:active{--lift:-10px}
.hand .card.off{filter:brightness(.55) saturate(.6)}
@keyframes deal{from{opacity:0;transform:translateY(60px) rotate(0)}}

/* trick */
.tc{position:absolute;width:var(--tw);height:var(--th);transform:rotate(var(--rot));animation:fly .38s cubic-bezier(.2,.8,.2,1) both;
  --cw:var(--tw)}
.tc.static{animation:none}
.p0{left:50%;bottom:0;margin-left:calc(var(--tw)/-2);--fx:0px;--fy:180px}
.p2{left:50%;top:0;margin-left:calc(var(--tw)/-2);--fx:0px;--fy:-180px}
.p1{left:0;top:50%;margin-top:calc(var(--th)/-2);--fx:-180px;--fy:0px}
.p3{right:0;top:50%;margin-top:calc(var(--th)/-2);--fx:180px;--fy:0px}
@keyframes fly{from{transform:translate(var(--fx),var(--fy)) scale(.85);opacity:0}to{transform:rotate(var(--rot));opacity:1}}
#trick.collect .tc{animation:none;transition:transform .45s cubic-bezier(.5,0,.8,.4),opacity .45s;transform:translate(var(--cx),var(--cy)) scale(.4);opacity:0}
.tc.win{box-shadow:0 0 0 2px var(--gold),0 10px 24px -6px rgba(0,0,0,.6)}

/* ---------- overlays ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(4,12,18,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s ease both}
@keyframes fade{from{opacity:0}}
.panel{width:min(440px,100%);max-height:calc(100% - 16px);overflow:auto;background:linear-gradient(180deg,#132d3c,#0d2230);border:1px solid rgba(214,163,76,.28);border-radius:22px;padding:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 30px 60px -20px rgba(0,0,0,.8);animation:rise .4s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes rise{from{transform:translateY(20px) scale(.97);opacity:0}}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2);font-weight:700}
.panel h2{font-family:var(--display);font-weight:700;font-size:22px;margin:6px 0 12px;text-wrap:balance;letter-spacing:-.01em}
.panel p{color:#c3d1d7;line-height:1.55;font-size:14px;margin:0 0 10px}
.split{margin:14px 0 6px}
.bar{height:12px;border-radius:999px;background:#3a5361;position:relative;overflow:hidden;display:flex}
.bar span{height:100%}
.bar .a{background:var(--gold)}
.bar .b{background:#6d8795}
.bar i{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ivory);opacity:.8}
.bar-l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;margin-top:6px;color:#c3d1d7;font-variant-numeric:tabular-nums}
.bar-l b{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:14px;border:0;font-weight:700;font-size:15px;cursor:pointer;transition:transform .12s,filter .2s}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1a1408;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px -8px rgba(214,163,76,.6)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row .btn{flex:1 1 130px;white-space:nowrap}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:13.5px;line-height:1.5;color:#c3d1d7}
.rules li b{color:var(--text)}
.rules .k{width:22px;height:22px;border-radius:6px;background:rgba(214,163,76,.15);color:var(--gold-2);display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;margin-top:1px}
.opts{display:grid;gap:14px;margin:4px 0 4px}
.og{display:grid;gap:7px}
.og-t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg.three{grid-template-columns:1fr 1fr 1fr}.seg.three label{flex-direction:column;align-items:flex-start;gap:6px}
.seg label{position:relative;display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);cursor:pointer;font-size:13px;font-weight:600;line-height:1.3;transition:border-color .2s,background .2s}
.seg input{position:absolute;opacity:0;pointer-events:none}
.ico{flex:none;position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--gold-2);
  background:radial-gradient(90% 70% at 30% 15%,rgba(255,255,255,.1),transparent 60%),linear-gradient(160deg,#1f4a5d,#0b2230 75%);
  box-shadow:inset 0 0 0 1px rgba(241,203,128,.34),inset 0 1px 0 rgba(255,255,255,.12),inset 0 -6px 12px rgba(0,0,0,.35),0 6px 14px -6px rgba(0,0,0,.7);transition:box-shadow .25s,transform .2s}
.ico svg{width:30px;height:30px;overflow:visible}
.ico svg .t{font-family:var(--mono);font-weight:700;fill:url(#icoGold);stroke:none;text-anchor:middle}
.ico svg .d{font-family:var(--display);font-weight:800;fill:url(#icoGold);stroke:none;text-anchor:middle}
.ico .no{position:absolute;right:-5px;top:-5px;width:17px;height:17px;border-radius:6px;background:#0d2230;box-shadow:0 0 0 1px rgba(214,163,76,.4);font-family:var(--mono);font-size:9.5px;font-weight:700;display:grid;place-items:center;color:var(--muted)}
.seg input:checked+.ico{background:radial-gradient(90% 70% at 30% 15%,rgba(255,240,200,.22),transparent 60%),linear-gradient(160deg,#2c6177,#0f3040 75%);box-shadow:inset 0 0 0 1.5px #f1cb80,inset 0 1px 0 rgba(255,255,255,.2),0 0 0 3px rgba(214,163,76,.18),0 10px 22px -8px rgba(214,163,76,.65);transform:translateY(-1px)}
.seg input:checked+.ico .no{color:var(--gold-2)}
.seg .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.seg .tx small{font-size:11px;font-weight:500;color:var(--muted)}
.seg label:has(input:checked){border-color:rgba(214,163,76,.7);background:rgba(214,163,76,.1)}
.seg label:has(input:focus-visible){outline:2px solid var(--gold-2);outline-offset:2px}
.brk{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px;font-size:13.5px;color:#c3d1d7}
.brk li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed rgba(255,255,255,.08);padding-bottom:4px}
.brk li b{font-family:var(--mono);color:var(--gold-2)}
.rlist{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:10px}
.rlist li{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}
/* result */
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin:4px 0 12px}
.side{border-radius:16px;padding:12px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);display:flex;flex-direction:column;gap:4px;min-width:0}
.side.won{background:linear-gradient(180deg,rgba(241,203,128,.14),rgba(214,163,76,.03));box-shadow:inset 0 0 0 1px rgba(214,163,76,.55)}
.side .sn{font-family:var(--display);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.side.won .sn::after{content:attr(data-won);font-family:var(--body);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;background:var(--gold);color:#1a1408;border-radius:4px;padding:2px 5px}
.side .big{font-family:var(--mono);font-weight:700;font-size:38px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.side.won .big{color:var(--gold-2)}
.side .sub{font-size:11.5px;color:var(--muted)}
.mcs{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.mc{display:inline-flex;align-items:center;gap:1px;height:20px;padding:0 4px;border-radius:5px;background:var(--ivory);color:var(--ink);font-family:var(--display);font-weight:700;font-size:10px;opacity:0;animation:mcin .3s ease both;animation-delay:calc(var(--i)*35ms + 250ms)}
.mc.red{color:var(--crim)}
.mc svg{width:9px;height:9px}
@keyframes mcin{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.vs{align-self:center;display:flex;flex-direction:column;align-items:center;font-family:var(--mono);font-size:10px;color:var(--muted);gap:2px}
.vs b{font-size:15px;color:var(--text)}
.bar span{transition:width 1s cubic-bezier(.2,.8,.2,1)}
.brk li{align-items:center}
.brk .ico{width:30px;height:30px;border-radius:9px}
.brk .ico svg{width:22px;height:22px}
.brk li>span{display:flex;align-items:center;gap:10px}
.eyerow{display:flex;justify-content:space-between;align-items:center;margin:12px 0 2px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.18)}
.eyerow .eg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.eyerow .eg b{color:var(--text);font-size:14px}
.six.lg{width:61px;height:90px}
.six .cov.slide{transform-box:view-box;transform-origin:50px 70px;animation:covslide .9s cubic-bezier(.45,0,.2,1) both}
@keyframes covslide{from{transform:translate(var(--fx),var(--fy)) rotate(var(--fa))}to{transform:translate(var(--tx),var(--ty)) rotate(var(--ta))}}
.hw{color:var(--gold-2)}.hl{color:#ef8a94}
.jrow{display:flex;gap:6px;margin:4px 0 14px;--cw:46px;--ch:65px}

/* ---------- title ---------- */
.title{position:fixed;inset:0;z-index:30;overflow:auto;background:
  radial-gradient(80% 60% at 78% 40%,rgba(28,78,102,.55),transparent 70%),
  repeating-linear-gradient(45deg,rgba(214,163,76,.03) 0 1px,transparent 1px 26px),
  repeating-linear-gradient(-45deg,rgba(214,163,76,.03) 0 1px,transparent 1px 26px),var(--bg)}
.title-in{min-height:100%;max-width:1080px;margin:0 auto;padding-inline:24px;padding-block:40px;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:32px}
.t-eyebrow{display:flex;gap:10px;align-items:center;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-2);font-weight:700}
.t-eyebrow i{width:26px;height:1px;background:var(--gold)}
.wordmark{font-family:var(--display);font-weight:800;font-size:clamp(56px,11vw,128px);line-height:.9;letter-spacing:-.03em;margin:18px 0 18px;color:var(--ivory)}
.wordmark span{display:block;font-size:.2em;letter-spacing:.42em;font-weight:500;color:var(--muted);margin-top:14px}
.t-copy{font-size:16px;line-height:1.6;color:#c3d1d7;max-width:44ch;margin:0}
.t-copy b{color:var(--ivory)}
.t-stats{margin-top:18px;font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fan{position:relative;height:clamp(230px,34vw,360px);--cw:clamp(100px,14vw,150px);--ch:calc(var(--cw)*1.42)}
.fan .card{position:absolute;left:50%;top:50%;margin-left:calc(var(--cw)/-2);margin-top:calc(var(--ch)/-2);transform-origin:50% 140%;
  transform:rotate(var(--r)) translateY(-6px);animation:fanin .9s cubic-bezier(.2,.9,.25,1.1) both;animation-delay:calc(var(--i)*110ms + 150ms);box-shadow:0 0 0 1px rgba(27,35,44,.2),0 24px 40px -18px rgba(0,0,0,.9)}
@keyframes fanin{from{transform:rotate(0) translateY(40px);opacity:0}}
.fan-cap{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.06em}
.fan-cap b{color:var(--gold-2);font-weight:700}

.ssuit{position:absolute;left:-7px;bottom:-5px;width:20px;height:20px;border-radius:7px;background:var(--ivory);color:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 1.5px rgba(214,163,76,.5),0 3px 6px rgba(0,0,0,.4)}
.ssuit.red{color:var(--crim)}.ssuit svg{width:12px;height:12px}
.ssuit.on{box-shadow:0 0 0 2px var(--gold),0 0 12px rgba(241,203,128,.7)}
.ssuit.mine{position:static;width:auto;min-width:24px;height:24px;padding:0 6px;gap:4px;display:inline-flex;align-items:center}
.ssuit.mine i{font-style:normal;font-family:var(--display);font-weight:800;font-size:10.5px;display:inline-flex;align-items:center;gap:1px;height:18px;padding:0 6px 0 4px;margin-right:-3px;border-radius:999px;background:linear-gradient(180deg,#fbe3a6,#d6a34c);color:#1a1408}
.ssuit.mine i svg{width:9px;height:9px}
.rvs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.rv{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:10px;border-radius:14px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.rv.on{box-shadow:inset 0 0 0 1.5px var(--gold);background:rgba(214,163,76,.1)}
.rv-s{grid-row:1/3;width:34px;height:34px;border-radius:10px;background:var(--ivory);color:var(--ink);display:grid;place-items:center}
.rv-s.red{color:var(--crim)}.rv-s svg{width:20px;height:20px}
.rv b{font-size:14px}.rv small{font-size:11.5px;color:var(--muted)}
.t-stats{all:unset;display:block;margin-top:22px;max-width:420px;cursor:pointer;border-radius:18px}
.rcard{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;padding:14px;border-radius:18px;background:linear-gradient(160deg,rgba(31,74,93,.55),rgba(11,34,48,.7));box-shadow:inset 0 0 0 1px rgba(241,203,128,.25),0 14px 30px -18px rgba(0,0,0,.9)}
.rb{grid-row:1/3}
.ri{display:flex;flex-direction:column;gap:2px;min-width:0}
.ri small{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2);font-weight:700}
.ri b{font-family:var(--mono);font-size:26px;line-height:1;color:var(--ivory)}
.ri span{font-family:var(--display);font-weight:700;font-size:13px}
.ri em{font-style:normal;font-size:11.5px;color:var(--muted)}
.rbar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin:4px 0 2px}
.rbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#b0782a,#f1cb80)}
.rs{grid-column:2;display:flex;gap:16px;font-size:11px;color:var(--muted)}
.rs b{display:block;font-family:var(--mono);font-size:15px;color:var(--text)}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ladder li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:6px 10px;border-radius:12px;font-weight:600;font-size:14px;opacity:.55}
.ladder li.done{opacity:.85}.ladder li.me{opacity:1;background:rgba(214,163,76,.12);box-shadow:inset 0 0 0 1px rgba(214,163,76,.5)}
.ladder b{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.rdelta{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.2)}
.rdelta span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rdelta b{font-family:var(--mono);font-size:24px}
.rdelta em{font-style:normal;font-family:var(--mono);font-weight:700}
.rdelta.up em{color:#7fd08a}.rdelta.down em{color:#ef7580}
.rdelta i{flex-basis:100%;font-style:normal;color:var(--gold-2);font-weight:700;font-size:13px}
:root[data-felt="emerald"] .table{--felt:#135040;--felt-2:#0b3329}
:root[data-felt="walnut"] .table{background:radial-gradient(120% 90% at 50% 45%,rgba(255,220,170,.1),transparent 60%),repeating-linear-gradient(92deg,rgba(0,0,0,.18) 0 2px,transparent 2px 38px),repeating-linear-gradient(88deg,rgba(255,255,255,.04) 0 1px,transparent 1px 9px),linear-gradient(180deg,#6b3b22,#3e2113)}
:root[data-felt="ebony"] .table{background:radial-gradient(120% 90% at 50% 45%,rgba(255,220,170,.08),transparent 60%),repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 2px,transparent 2px 46px),repeating-linear-gradient(89deg,rgba(255,220,170,.035) 0 1px,transparent 1px 7px),linear-gradient(180deg,#3a2a20,#1d1511)}
.decks{display:grid;gap:8px}
.deck,.felt{position:relative;display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);cursor:pointer;min-height:44px}
.deck input,.felt input{position:absolute;opacity:0;pointer-events:none}
.deck:has(input:checked),.felt:has(input:checked){box-shadow:inset 0 0 0 1.5px var(--gold);background:rgba(214,163,76,.1)}
.deck:has(input:focus-visible),.felt:has(input:focus-visible){outline:2px solid var(--gold-2);outline-offset:2px}
.dk-row{display:flex;--cw:36px;--ch:51px}
.dk-row .card{margin-left:-10px;box-shadow:0 2px 6px rgba(0,0,0,.4)}.dk-row .card:first-child{margin-left:0}
.deck b,.felt b{font-size:14px}
.felts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.felt{flex-direction:column;align-items:stretch;gap:8px}
.felt .sw{display:block;height:52px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 10px 20px rgba(0,0,0,.25)}
.langs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);margin-bottom:18px}
.langs button{all:unset;cursor:pointer;min-width:44px;height:32px;display:grid;place-items:center;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);transition:background .2s,color .2s}
.langs button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1a1408}
.langs button:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.lang-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lang-seg .felt{align-items:center;justify-content:center;min-height:48px}
/*ONLINE-CSS-START*/
/* ---------- online ---------- */
.online-btn{background:rgba(255,255,255,.06);border:1px solid rgba(214,163,76,.55);color:var(--gold-2);gap:10px}
.online-btn .live{width:8px;height:8px;border-radius:50%;background:#62d49a;box-shadow:0 0 0 0 rgba(98,212,154,.6);animation:live 1.8s infinite}
@keyframes live{70%{box-shadow:0 0 0 8px rgba(98,212,154,0)}100%{box-shadow:0 0 0 0 rgba(98,212,154,0)}}
.chatb{position:relative}
.chatb.has::after{content:attr(data-n);position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#e0606c;color:#fff;font:700 10.5px/18px var(--body);text-align:center}
.online{position:fixed;inset:0;z-index:32;overflow:auto;background:
  radial-gradient(80% 60% at 78% 20%,rgba(28,78,102,.5),transparent 70%),
  repeating-linear-gradient(45deg,rgba(214,163,76,.03) 0 1px,transparent 1px 26px),
  repeating-linear-gradient(-45deg,rgba(214,163,76,.03) 0 1px,transparent 1px 26px),var(--bg)}
.on-wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 96px;min-height:100%;display:flex;flex-direction:column;gap:16px}
.on-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;position:sticky;top:0;z-index:2;padding-block:8px;background:linear-gradient(180deg,var(--bg) 70%,transparent)}
.on-top .ibtn{width:44px;height:44px;padding:0;justify-content:center}
.on-title{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:15px;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.on-title i{width:8px;height:8px;border-radius:50%;background:#62d49a}
.on-me{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(214,163,76,.3);min-height:32px;justify-content:center}
.on-me b{font-size:13px}.on-me span{font-family:var(--mono);font-size:12px;color:var(--gold-2)}
.on-me:focus-visible{outline:2px solid var(--gold-2)}
.on-body{display:flex;flex-direction:column;gap:14px}
.on-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.on-head h2{font-family:var(--display);font-size:22px;margin:0;letter-spacing:-.01em}
.btn.sm{height:40px;padding:0 16px;font-size:14px;border-radius:12px}
.btn.xs{height:30px;padding:0 10px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.on-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(8,22,31,.92);box-shadow:inset 0 0 0 1px rgba(214,163,76,.25),0 14px 30px -10px rgba(0,0,0,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:3}
.on-nav button{all:unset;cursor:pointer;min-width:84px;height:40px;padding:0 14px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:13.5px;color:var(--muted)}
.on-nav button[aria-current="true"]{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1a1408}
.on-nav button:focus-visible{outline:2px solid var(--gold-2)}
.on-wait,.on-empty,.on-hint{color:var(--muted);font-size:13.5px;text-align:center;margin:6px 0}
.on-empty{padding:28px 0}
/* auth */
.on-auth{max-width:380px;width:100%;margin:12px auto 0;display:flex;flex-direction:column;gap:18px}
.on-logo{display:flex;justify-content:center;gap:10px}
.on-logo span{width:48px;height:48px;border-radius:14px;background:var(--ivory);color:var(--ink);display:grid;place-items:center;box-shadow:0 10px 20px -10px rgba(0,0,0,.8)}
.on-logo span.red{color:var(--crim)}.on-logo svg{width:26px;height:26px}
.on-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.on-seg button{all:unset;cursor:pointer;height:40px;display:grid;place-items:center;border-radius:10px;font-weight:700;color:var(--muted)}
.on-seg button[aria-pressed="true"]{background:rgba(214,163,76,.16);color:var(--gold-2);box-shadow:inset 0 0 0 1px rgba(214,163,76,.5)}
.on-form{display:flex;flex-direction:column;gap:6px}
.on-form label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.on-form input,.on-send input{height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);color:var(--text);padding:0 14px;font:500 16px var(--body)}
.on-form input:focus,.on-send input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(214,163,76,.2)}
.on-form small{font-size:12px;color:var(--muted)}
.on-err{min-height:20px;color:#ef8a94;font-size:13.5px;margin:6px 0 4px}
/* rooms */
.on-rooms{display:grid;gap:10px}
.on-room{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:16px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.on-room>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.on-room small{color:var(--muted);font-size:12px;font-family:var(--mono)}
.on-rl{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.on-rl .ico{width:30px;height:30px;border-radius:9px}.on-rl .ico svg{width:22px;height:22px}
/* leaderboard */
.lb{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:10px 10px}
.lbc{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px 12px 26px;border-radius:16px;background:linear-gradient(160deg,rgba(31,74,93,.5),rgba(11,34,48,.7));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);min-width:0}
.lbc b{font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbc em{font-style:normal;font-family:var(--mono);font-weight:700;font-size:14px;color:#8fc3de;font-variant-numeric:tabular-nums}
.lbr{position:absolute;left:-6px;bottom:-6px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#16384a;box-shadow:0 0 0 3px var(--bg),inset 0 0 0 1px rgba(255,255,255,.12);font:700 12px var(--mono);color:var(--muted)}
.lbc.podium{box-shadow:inset 0 0 0 1.5px rgba(214,163,76,.55)}
.lbc.podium .lbr{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1a1408}
.lbc.rk1 .lbr{background:linear-gradient(180deg,#e8eef2,#9fb3bd)}.lbc.rk2 .lbr{background:linear-gradient(180deg,#e7b98d,#b98a5a)}
.lbc.mine{box-shadow:inset 0 0 0 2px #62d49a}
/* profile */
.on-prof{display:flex;flex-direction:column;gap:14px}
.on-pcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px;border-radius:18px;background:linear-gradient(160deg,rgba(31,74,93,.55),rgba(11,34,48,.7));box-shadow:inset 0 0 0 1px rgba(241,203,128,.25)}
.on-pcard div{display:flex;flex-direction:column;gap:2px;min-width:0}
.on-pcard small{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2);font-weight:700}
.on-pcard b{font-family:var(--display);font-size:20px;overflow:hidden;text-overflow:ellipsis}
.on-pcard span{font-weight:700;font-size:13px}
.on-pcard em{font-style:normal;font-family:var(--mono);font-weight:700;font-size:22px;color:var(--gold-2)}
.on-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.on-stats div{padding:12px;border-radius:14px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);display:flex;flex-direction:column;gap:2px}
.on-stats b{font-family:var(--mono);font-size:22px}.on-stats span{font-size:12px;color:var(--muted)}.on-stats span::first-letter{text-transform:uppercase}
/* room table */
.on-table{display:grid;grid-template-columns:1fr 1.1fr 1fr;grid-template-rows:auto auto auto;gap:10px;align-items:center}
.on-seat{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:16px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);min-height:118px;justify-content:center;text-align:center;min-width:0}
.on-seat.s2{grid-column:2;grid-row:1}.on-seat.s1{grid-column:1;grid-row:2}.on-seat.s3{grid-column:3;grid-row:2}.on-seat.s0{grid-column:2;grid-row:3}
.on-seat.ta{box-shadow:inset 0 0 0 1px rgba(214,163,76,.35)}.on-seat.tb{box-shadow:inset 0 0 0 1px rgba(143,195,222,.35)}
.on-seat.sel{box-shadow:inset 0 0 0 2px var(--gold-2),0 0 0 4px rgba(214,163,76,.2);transform:translateY(-2px)}
.on-seat.empty{border:1.5px dashed rgba(255,255,255,.14);box-shadow:none}
.on-seat:focus-visible{outline:2px solid var(--gold-2)}
.on-seat b{font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.on-seat small{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.on-ava{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 18px var(--display);color:#f5e7c4;background:radial-gradient(circle at 35% 28%,#2b6a86,#0a1c26);box-shadow:inset 0 0 0 2px rgba(241,203,128,.6)}
.on-seat.tb .on-ava{background:radial-gradient(circle at 35% 28%,#8a5a2e,#1c120a)}
.on-ava.empty{background:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2);color:var(--muted)}
.on-ava .crown{position:absolute;top:-10px;right:-8px;font-style:normal;font-size:15px;color:var(--gold-2);text-shadow:0 1px 2px #000}
.on-x{position:absolute;top:6px;right:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(224,96,108,.18);color:#ef8a94;font-size:12px}
.on-mid{grid-column:2;grid-row:2;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px;border-radius:14px;background:radial-gradient(circle,rgba(28,78,102,.5),transparent 70%)}
.on-mid small{font-size:11.5px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}.dot.ta{background:var(--gold)}.dot.tb{background:#8fc3de}
/* chat */
.on-chat{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.on-chat-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.on-mute{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer;min-height:32px}
.on-msgs{max-height:220px;min-height:80px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.on-msgs p{margin:0;font-size:14px;line-height:1.4;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.05);max-width:85%;align-self:flex-start;overflow-wrap:anywhere}
.on-msgs p b{display:block;font-size:11.5px;color:var(--gold-2)}
.on-msgs p.mine{align-self:flex-end;background:rgba(214,163,76,.14)}
.on-msgs p.on-empty{background:none;align-self:center}
.on-send{display:flex;gap:8px}.on-send input{flex:1;min-width:0;height:42px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:420px){.on-table{grid-template-columns:1fr 1fr 1fr;gap:6px}.on-seat{min-height:104px;padding:10px 4px}.on-ava{width:38px;height:38px;font-size:16px}.lb{grid-template-columns:1fr 1fr}.on-nav button{min-width:72px;padding:0 10px}}

/*ONLINE-CSS-END*/
/* ---------- effects ---------- */
.fx{position:fixed;inset:0;z-index:60;backdrop-filter:blur(8px) saturate(.7);-webkit-backdrop-filter:blur(8px) saturate(.7);display:grid;place-items:center;overflow:hidden;cursor:pointer;animation:fade .3s both;-webkit-user-select:none;user-select:none}
.fx.out{animation:fxout .35s both}
@keyframes fxout{to{opacity:0}}
.fx canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fx .stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:16px;max-width:520px}
.fx .kick{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.24em;color:var(--gold-2)}
.fx h3{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,68px);letter-spacing:-.02em;line-height:.95;margin:0;color:var(--ivory);text-wrap:balance}
.fx p{margin:0;color:#c9d6db;font-size:15px;line-height:1.5;max-width:34ch}
.fx .tap{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);animation:fade .4s 1.4s both}
.gold-ink{background:linear-gradient(180deg,#fff4d2 10%,#f1cb80 45%,#b47a26 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(90,55,10,.5))}
.fx.egg{background:radial-gradient(55% 45% at 50% 42%,rgba(92,70,34,.92),rgba(9,20,28,.97) 72%)}
.rays{position:absolute;left:50%;top:40%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(rgba(241,203,128,.16) 0deg 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 6%,transparent 42%);mask-image:radial-gradient(circle,#000 6%,transparent 42%);animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.goldegg{width:min(44vw,190px);height:auto;filter:drop-shadow(0 24px 30px rgba(0,0,0,.5)) drop-shadow(0 0 40px rgba(241,203,128,.45));animation:eggdrop 1.1s cubic-bezier(.3,1.5,.5,1) both}
.goldegg .wob{transform-origin:50% 92%;transform-box:fill-box;animation:wob 2.6s 1.2s ease-in-out infinite}
.goldegg .glint{animation:glint 2.6s 1s ease-in-out infinite}
@keyframes eggdrop{0%{transform:translateY(-90vh) rotate(-25deg)}55%{transform:translateY(0) rotate(8deg)}75%{transform:translateY(-14px) rotate(-5deg)}100%{transform:none}}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-2deg)}}
@keyframes glint{0%,100%{opacity:.2}50%{opacity:1}}
.fx .up{animation:up .6s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d,0s)}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.fx.naked{background:radial-gradient(60% 50% at 50% 45%,rgba(120,30,42,.9),rgba(8,14,20,.97) 70%)}
.slam{font-family:var(--display);font-weight:800;font-size:clamp(36px,12vw,112px);line-height:.9;letter-spacing:-.03em;animation:slam .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slam{from{transform:scale(3.4) rotate(-6deg);opacity:0}}
.ring{position:absolute;left:50%;top:44%;width:44px;height:44px;margin:-22px;border-radius:50%;border:3px solid var(--gold-2);opacity:0;animation:ring 1.3s .42s cubic-bezier(.1,.6,.3,1) both}
.ring.r2{animation-delay:.6s;border-color:var(--ivory)}
.ring.r3{animation-delay:.8s;border-color:#e0606c}
@keyframes ring{0%{transform:scale(0);opacity:1}100%{transform:scale(20);opacity:0}}
.score-big{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.06em;color:var(--ivory)}
.score-big b{color:var(--gold-2)}
.score-big::before{content:"Біз ";font-size:.55em;color:var(--muted)}.score-big::after{content:" Олар";font-size:.55em;color:var(--muted)}
.fx .who{font-family:var(--display);font-weight:700;font-size:clamp(16px,4.6vw,22px);padding:8px 18px;border-radius:999px;background:var(--gold);color:#1a1408;box-shadow:0 8px 24px -8px rgba(214,163,76,.8)}
.fx.lost .who{background:#e0606c;color:#fff;box-shadow:0 8px 24px -8px rgba(224,96,108,.8)}
.fx.lost .ring{border-color:#e0606c}
.red-ink{color:#ef7580;text-shadow:0 3px 0 rgba(80,10,20,.6)}
.shake{animation:shake .55s .4s both}
@keyframes shake{10%,50%,90%{transform:translate(-7px,3px)}30%,70%{transform:translate(7px,-3px)}100%{transform:none}}
.hangegg{width:min(46vw,200px);height:auto;filter:drop-shadow(0 20px 26px rgba(0,0,0,.5)) drop-shadow(0 0 36px rgba(241,203,128,.4));animation:eggdrop 1s cubic-bezier(.3,1.5,.5,1) both}
.hangegg .swing{transform-origin:100px 6px;transform-box:view-box;animation:swing 1.6s .9s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.fx.hang{background:radial-gradient(55% 45% at 50% 42%,rgba(92,70,34,.92),rgba(9,20,28,.97) 72%)}
.fx.hang.lost{background:radial-gradient(55% 45% at 50% 42%,rgba(110,34,44,.9),rgba(9,20,28,.97) 72%)}
.fx.mock{background:radial-gradient(60% 50% at 50% 45%,rgba(30,48,58,.9),rgba(8,14,20,.97) 70%)}
.goat{width:min(38vw,150px);color:var(--ivory);animation:goat 1.2s .5s ease-in-out infinite alternate,up .6s both}
@keyframes goat{from{transform:rotate(-6deg)}to{transform:rotate(6deg) translateY(-4px)}}
.stamp{font-family:var(--display);font-weight:800;font-size:clamp(28px,9.5vw,88px);white-space:nowrap;line-height:1;color:#e0606c;border:6px solid currentColor;border-radius:18px;padding:6px 24px 10px;transform:rotate(-8deg);animation:stamp .5s .25s cubic-bezier(.2,1.6,.4,1) both;box-shadow:inset 0 0 0 3px rgba(224,96,108,.25)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.6);opacity:0}}
.redeal-hand{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 12px}
.redeal-hand .mc{height:28px;font-size:13px;padding:0 7px}
.redeal-hand .mc svg{width:12px;height:12px}
.redeal-hand .mc.hl{box-shadow:0 0 0 2px var(--gold)}
.big-reason{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.big-reason .ico{width:54px;height:54px;border-radius:16px}
.big-reason .ico svg{width:38px;height:38px}
.big-reason b{font-family:var(--mono);font-size:30px;color:var(--gold-2)}
.big-reason span{color:#c3d1d7;font-size:13.5px;line-height:1.4}
.ibtn.snd[aria-pressed="false"]{opacity:.55}
@media (max-width:760px){
  .title-in{grid-template-columns:1fr;padding-block:28px;gap:10px}
  .fan{order:-1;height:210px;--cw:88px}
}

  .team{padding:7px 8px;column-gap:7px}

  .tsuit{width:32px;height:32px}
  .tinfo b{font-size:12px}
  .ibtn span{display:none}
  .ibtn{padding:0 10px}
  .ava{width:42px;height:42px}

  .s1 .nm small,.s3 .nm small{display:none}

  .nm{font-size:11px;padding:2px 7px}
  #trick{width:calc(var(--tw)*2.9)}
}

const isTrump=c=>c.r==='J'||c.s===G.trump;

function legal(hand,tr){if(!tr.length)return hand.slice();const led=eff(tr[0].card);const f=hand.filter(c=>eff(c)===led);if(f.length)return f;

  if(rules.ace==='played'){const ok=hand.filter(c=>!(c.r==='A'&&eff(c)!=='T'&&!(G.led||[]).includes(c.s)));if(ok.length)return ok}
  return hand.slice()}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sortHand(h){
  const so={T:0,C:1,H:2,S:3,D:4};
  return h.sort((a,b)=>(so[eff(a)]-so[eff(b)])||(power(b)-power(a)));
}

/* ---------- bots ---------- */
function isTop(c,seat){
  const mine=new Set(G.hands[seat].map(key));
  const onTable=new Set(G.trick.map(t=>key(t.card)));
  return !fullDeck().some(d=>eff(d)===eff(c)&&power(d)>power(c)&&!G.played.includes(key(d))&&!mine.has(key(d))&&!onTable.has(key(d)));
}
function lowest(L){

}
function botPick(seat){
  const hand=G.hands[seat],L=legal(hand,G.trick),team=seat%2;
  const byPow=(a,b)=>power(a)-power(b);
  if(!G.trick.length){
    const trumps=hand.filter(c=>eff(c)==='T');
    const topT=trumps.filter(c=>isTop(c,seat)).sort((a,b)=>power(b)-power(a));
    if(team===G.trumpTeam&&trumps.length>=3&&topT.length)return topT[0];
    const aces=hand.filter(c=>eff(c)!=='T'&&c.r==='A');
    if(aces.length)return aces[Math.floor(Math.random()*aces.length)];
    const tops=hand.filter(c=>eff(c)!=='T'&&isTop(c,seat)&&PTS[c.r]>=10);
    if(tops.length)return tops[0];
    if(topT.length&&trumps.length>=4)return topT[0];
    return lowest(hand);
  }
  const ws=trickWinner(G.trick),best=G.trick.find(t=>t.seat===ws).card;
  const last=G.trick.length===3;
  const trickPts=G.trick.reduce((s,t)=>s+PTS[t.card.r],0);
  if(ws%2===team){
    const safe=last||isTop(best,seat)||(G.trick.length===2&&power(best)>=60);
    if(safe){
      const pool=L.slice().sort((a,b)=>(PTS[b.r]-PTS[a.r])||(power(a)-power(b)));
      const non=pool.filter(c=>c.r!=='J'&&!(eff(c)==='T'&&c.r==='A'));
      return (non.length?non:pool)[0];
    }
    return lowest(L);
  }
  const winners=L.filter(c=>beats(c,best)).sort(byPow);
  if(winners.length){
    const cheap=winners[0];
    if(last)return cheap;
    if(trickPts>=10)return isTop(winners[winners.length-1],seat)?winners[winners.length-1]:cheap;
    if(eff(cheap)!=='T'&&isTop(cheap,seat))return cheap;
    if(eff(cheap)!=='T'&&PTS[cheap.r]>=10)return cheap;
    if(trickPts>=3)return cheap;
  }
  return lowest(L);
}

/* ---------- flow ---------- */
function newGame(){
  clearTimers();
  G={rules:{...RULES},eyes:[0,0],deal:0,dealer:Math.floor(Math.random()*4),seatSuit:null,bonus:0,hung:[0,0],phase:'play',hands:[[],[],[],[]],trick:[],played:[],leader:0,turn:0,pts:[0,0],trump:'C',trumpTeam:0,jcHolder:0,lock:false,fresh:true,result:null};
  $('#title').hidden=true;closeSheet();

}
function startDeal(){
  G.deal++;G.dealer=(G.dealer+1)%4;
  const d=shuffle(fullDeck());
  G.hands=[0,1,2,3].map(i=>d.slice(i*8,i*8+8));
  const rd=checkRedeal();
  if(rd){G.deal--;G.dealer=(G.dealer+3)%4;G.phase='redeal';G.redeal=rd;G.trick=[];G.fresh=true;
    G.jcHolder=-1;rebuildTrick();renderAll();sfx.shuffle();if(ENG)later(()=>{G.redeal=null;startDeal()},4500);else later(showRedeal,500);return}
  sfx.deal();
  const holder=G.hands.findIndex(h=>h.some(c=>c.s==='C'&&c.r==='J'));
  if(!G.seatSuit){G.seatSuit={};G.firstHolder=holder;['C','H','S','D'].forEach((s,k)=>G.seatSuit[(holder+k)%4]=s)}
  G.trump=G.seatSuit[holder];G.trumpTeam=G.deal===1?-1:holder%2;G.jcHolder=G.deal===1?-1:holder;
  G.hands.forEach(sortHand);
  G.pts=[0,0];G.tk=[0,0];G.won=[[],[]];G.led=[];G.trick=[];G.played=[];G.phase='play';G.lock=false;G.fresh=true;G.result=null;
  G.leader=(G.dealer+1)%4;G.turn=G.leader;
  rebuildTrick();renderAll();
  const r=RED(G.trump)?' class="red"':'';
  if(G.deal===1){toast(t('deal1Toast',svg('C')),3200);later(next,900);return}
  toast(t('jackToast',LOC[holder],svg('C')+LABEL.J,`<span${r} style="display:inline-flex">${svg(G.trump)}</span>`,SNAME[G.trump]),3200);
  later(next,900);
}
function showReveal(){
  const h=G.firstHolder;
  const rel=s=>s===h?'треф балтасы':s===(h+2)%4?'серіктесі':s===(h+1)%4?'сол жағы':'оң жағы';
  const rows=[0,1,2,3].map(s=>`<div class="rv${G.seatSuit[s]===G.trump?' on':''}"><span class="rv-s${RED(G.seatSuit[s])?' red':''}">${svg(G.seatSuit[s])}</span><b>${NAMES[s]}</b><small>${rel(s)}</small></div>`).join('');
  openSheet(`<div class="eyebrow">2-тарату · түстер бекітілді</div><h2>1-таратуда треф балтасы ${LOC[h]} болды</h2>
   <p>Енді әр орынның өз түсі бар. Треф балтасы кімге түссе, көзір — сол орынның түсі.</p>
   <div class="rvs">${rows}</div>
   <div class="big-reason">${icon('trump')}<div><b>${SNAME[G.trump]}</b><br><span>Бұл таратуда треф балтасы ${LOC[G.jcHolder]}. Көзір — ${SNAME[G.trump].toLowerCase()}.</span></div></div>
   <div class="row"><button class="btn gold" data-act="reveal-go">Ойнау</button></div>`);
}
function checkRedeal(){
  for(let s=0;s<4;s++){if(G.hands[s].filter(c=>c.r==='J').length===4)return{seat:s,kind:'jacks',cards:G.hands[s].map(key)}}
  for(let s=0;s<4;s++){const p=G.hands[s].reduce((a,c)=>a+PTS[c.r],0);if(p<10)return{seat:s,kind:'low',pts:p,cards:G.hands[s].map(key)}}
  return null;
}
function showRedeal(){if(ENG)return;
  const r=G.redeal;if(!r)return;
  const who=LOC[r.seat];
  const cards=r.cards.slice().sort((a,b)=>PTS[b.slice(1)]-PTS[a.slice(1)]).map((k,i)=>miniCard(k,i).replace('class="mc','class="mc'+((r.kind==='jacks'&&k.slice(1)==='J')||(r.kind==='low'&&PTS[k.slice(1)]>0)?' hl':''))).join('');
  const reason=r.kind==='jacks'
    ?`<div class="big-reason">${icon('jacks')}<div><b>${t('fourJacks')}</b><br><span>${t('fourJacksTxt',who)}</span></div></div>`
    :`<div class="big-reason">${icon('low')}<div><b>${t('pts',r.pts)}</b><br><span>${t('lowTxt',who)}</span></div></div>`;
  openSheet(`<div class="eyebrow">${t('redeal')}</div><h2>${r.kind==='jacks'?t('redealJacks'):t('redealLow')}</h2>${reason}<div class="og-t" style="margin-bottom:6px">${GEN[r.seat]}</div><div class="redeal-hand">${cards}</div>${ONLINE?`<p class="on-wait">${t('redealWait')}</p>`:`<div class="row"><button class="btn gold" data-act="redeal">${t('redeal')}</button></div>`}`);
}
function next(){
  renderSeats();renderHand();
  if(G.phase!=='play')return;
  if(ENG){onlineTurn(G.turn);return}
  if(G.turn!==0){const s=G.turn;later(()=>{if(G.phase==='play'&&G.turn===s)playCard(s,botPick(s))},560+Math.random()*420)}
}
function humanPlay(c){
  if(G.phase!=='play'||G.turn!==0||G.lock||G.trick.length>=4)return;
  if(!legal(G.hands[0],G.trick).includes(c))return;
  if(ONLINE){onlinePlay(c);return}
  playCard(0,c);
}
function playCard(seat,c){
  const h=G.hands[seat];const i=h.findIndex(x=>key(x)===key(c));if(i<0)return;
  h.splice(i,1);
  const rot=+(Math.random()*12-6).toFixed(1);
  if(!G.trick.length&&eff(c)!=='T'&&!G.led.includes(c.s))G.led.push(c.s);
  G.trick.push({seat,card:c,rot});sfx.card();G.played.push(key(c));
  addTrickCard(seat,c,true,rot);
  if(G.trick.length===4){G.lock=true;renderSeats();renderHand();later(finishTrick,950);return}
  G.turn=(seat+1)%4;next();
}
function finishTrick(){
  const w=trickWinner(G.trick);
  const pts=G.trick.reduce((s,t)=>s+PTS[t.card.r],0);
  const idx=G.trick.findIndex(t=>t.seat===w);
  const t=ENG?null:$('#trick');
  t&&t.children[idx]&&t.children[idx].classList.add('win');
  const dir={0:['0px','260px'],1:['-260px','0px'],2:['0px','-260px'],3:['260px','0px']}[w];
  later(()=>{
    if(t){t.style.setProperty('--cx',dir[0]);t.style.setProperty('--cy',dir[1]);t.classList.add('collect')}
    G.pts[w%2]+=pts;G.tk[w%2]++;G.won[w%2].push(...G.trick.map(x=>x.card));renderScore();
  },420);
  later(()=>{
    G.trick=[];rebuildTrick();G.lock=false;G.leader=w;G.turn=w;
    if(G.hands.every(h=>!h.length))endDeal();else next();
  },950);
}
function endDeal(){
  const [a,b]=G.pts;const RU=G.rules;let res;const prev=[...G.eyes];
  if(a===60&&b===60){G.bonus=RU.egg;res={kind:'eggs'}}
  else{
    const w=a>60?0:1,l=1-w;
    const naked=G.pts[w]===120;
    const parts=[];
    if(naked&&RU.naked==='win'){G.eyes[w]=12;parts.push(['nakedFin',12-prev[w],'nakedFin']);res={kind:'win',w,e:12-prev[w],parts,instant:true}}
    else{
      if(G.deal===1)parts.push(['deal1',2,'hidden']);
      else{parts.push(['win',1,'win1']);if(G.trumpTeam!==w)parts.push(['trump',1,'trump'])}
      if(naked)parts.push(['naked',4,'naked4']);
      else if(G.deal>1&&RU.save!=='none'&&G.pts[l]<RU.save)parts.push(['save',1,RU.save===30?'save30':'save31',[G.pts[l],RU.save]]);
      let e=parts.reduce((s,p)=>s+p[1],0);
      if(G.bonus==='plus4'){parts.push(['egg4',4,'egg4']);e+=4}
      else if(G.bonus==='hang'){G.hung=G.hung||[0,0];G.hung[w]++;parts.push(['egg',0,'eggHang'])}
      G.eyes[w]=Math.min(12,G.eyes[w]+e);
      res={kind:'win',w,e,parts};
    }
    G.bonus=0;
  }
  res.naked=res.kind==='win'&&G.pts[res.w]===120;
  res.pts=[a,b];res.deal=G.deal;res.prev=prev;res.tk=[...G.tk];res.tt=G.trumpTeam;
  res.won=G.won.map(arr=>arr.filter(c=>PTS[c.r]>0).sort((x,y)=>PTS[y.r]-PTS[x.r]||JORD[x.s]-JORD[y.s]).map(key));
  G.result=res;
  G.phase=(G.eyes[0]>=12||G.eyes[1]>=12)?'over':'result';
  renderAll();
  if(ENG){onlineDealEnded();return}
  if(G.phase==='over'){const s=getStats();G.eyes[0]>=12?s.w++:s.l++;setStats(s);G.result.rating=applyRating(G.eyes[0]>=12)}
  later(afterDeal,600);
}
async function afterDeal(){if(ENG)return;
  const r=G.result;if(!r)return;r.phaseAt=G.phase;
  if(r.kind==='eggs')await fx('egg',{text:t('eggFx',G.bonus==='hang'?t('eggFxHang'):t('eggFx4'))});
  else if(r.naked){const us=r.w===0;await fx('naked',{lost:!us,team:us?t('nakedUs'):t('nakedThem'),a:r.pts[0],b:r.pts[1],
    text:(us?t('nakedUsTxt'):t('nakedThemTxt'))+(r.instant?t('gameOverShort'):(us?t('plus4Us'):t('plus4Them')))})}
  if(G.phase==='over'){const l=G.eyes[0]>=12?1:0;if(G.hung&&G.hung[1-l]>0)await fx('hang',{us:l===1});if(G.eyes[l]===0)await fx('mock',{text:l===0?t('blindUs'):t('blindThem')})}
  if(G&&G.result&&(G.result===r||(ONLINE&&G.result.deal===r.deal&&G.phase===r.phaseAt)))showResult();
}
const partLabel=(p,r)=>p[0]==='egg'?t(r.w===0?'p_eggUs':'p_eggThem'):p[0]==='trump'?t(r.tt===0?'p_trumpUs':'p_trumpThem'):t('p_'+p[0],...(p[3]||[]));
const fmtR=v=>Number.isInteger(v)?String(v):v.toLocaleString(LANG==='en'?'en-US':'ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
function miniCard(k,i){const c={s:k[0],r:k.slice(1)};return `<span class="mc${RED(c.s)?' red':''}" style="--i:${i}">${LABEL[c.r]}${svg(c.s)}</span>`}
function showResult(){if(ENG)return;
  const r=G.result;if(!r)return;
  const over=G.phase==='over';
  const [a,b]=r.pts;
  const w=r.kind==='win'?r.w:-1;
  let head,why;
  if(r.kind==='eggs'){head=t('eggsHead');why=`<ul class="brk"><li><span>${icon(G.bonus==='hang'?'eggHang':'egg4')}${t('nextDeal',G.bonus==='hang'?t('hangNext'):t('p4'))}</span><b>—</b></li></ul>`}
  else{
    head=r.instant?(w===0?t('winNaked'):t('lossNaked')):(w===0?t('winHead',r.e):t('lossHead',r.e));
    why=`<ul class="brk">${r.parts.map(p=>`<li><span>${icon(p[2])}${partLabel(p,r)}</span><b>${p[1]?'+'+p[1]:'—'}</b></li>`).join('')}</ul>`;
  }
  const side=(tm,pts)=>`<div class="side${w===tm?' won':''}"><div class="sn" data-won="${t('won')}">${TEAM[tm]}</div><div class="big" data-count="${pts}">0</div><div class="sub">${t('sideSub',r.tk[tm])}</div><div class="mcs">${r.won[tm].map(miniCard).join('')}</div></div>`;
  const eyes=t=>{const e=G.eyes[t],p=r.prev[t];return `<div class="eg">${t===1?`<b>${e}</b>/12`:''}${sixSVG(e,t,p,'lg',1.1)}${t===0?`<b>${e}</b>/12`:''}</div>`};
  const body=`<div class="eyebrow">${t('dealResult',r.deal)}</div>
   <h2 class="${w===0?'hw':w===1?'hl':''}">${head}</h2>
   <div class="duel">${side(0,a)}<div class="vs"><b>61</b>${t('need')}</div>${side(1,b)}</div>
   <div class="bar"><span class="a" data-w="${a/120*100}" style="width:0"></span><span class="b" data-w="${b/120*100}" style="width:0"></span><i></i></div>
   <div style="height:12px"></div>
   ${why}
   <div class="eyerow">${eyes(0)}<span class="og-t" style="margin:0">${t('eyesWord')}</span>${eyes(1)}</div>`;
  if(over){
    const won=G.eyes[0]>=12;const s=getStats();
    openSheet(body.replace(/<div class="eyebrow">.*?<\/div>\s*<h2[^>]*>.*?<\/h2>/s,`<div class="eyebrow">${t('gameOver')}</div><h2 class="${won?'hw':'hl'}">${won?t('bigWin'):t('bigLoss')}</h2>`)+`${r.rating?`<div class="rdelta ${r.rating.now>=r.rating.old?'up':'down'}"><span>${t('rating')}</span><b>${r.rating.dec?fmt2(r.rating.now):fmtR(r.rating.now)}</b><em>${r.rating.now>=r.rating.old?'+':'−'}${r.rating.dec?fmt2(Math.abs(r.rating.now-r.rating.old)):fmtR(Math.abs(r.rating.now-r.rating.old))}</em>${r.rating.up?`<i>${t('newRank',tierName(tierOf(r.rating.now)))}</i>`:''}</div>`:''}${ONLINE?onlineOverRow():`<div class="row"><button class="btn gold" data-act="new">${t('again')}</button><button class="btn ghost" data-act="home">${t('home')}</button></div>`}`);
  } else {
    openSheet(body+(ONLINE?onlineNextRow():`<div class="row"><button class="btn gold" data-act="next">${t('next')}</button></div>`));
  }
  animateResult();
}
function animateResult(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll('#overlay .bar span[data-w]').forEach(el=>el.style.width=el.dataset.w+'%')}));
  document.querySelectorAll('#overlay [data-count]').forEach(el=>{
    const to=+el.dataset.count;if(reduce){el.textContent=to;return}
    const from=+(el.dataset.from||0),t0=performance.now(),d=1000;
    const step=t=>{const k=Math.min(1,(t-t0)/d);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}

/* ---- storage shape helpers (mimic Realtime Database) ---- */
function toStore(v){
  if(v===null||v===undefined)return undefined;
  if(Array.isArray(v)){const o={};let n=0;v.forEach((x,i)=>{const y=toStore(x);if(y!==undefined){o[i]=y;n++}});return n?o:undefined}
  if(typeof v==='object'){const o={};let n=0;for(const k in v){const y=toStore(v[k]);if(y!==undefined){o[k]=y;n++}}return n?o:undefined}
  return v;
}
function fromStore(v){
  if(v===null||v===undefined||typeof v!=='object')return v===undefined?null:v;
  const ks=Object.keys(v);
  if(ks.length&&ks.every(k=>/^\d+$/.test(k))){const mx=Math.max(...ks.map(Number));if(mx+1<=2*ks.length){const a=[];ks.forEach(k=>a[+k]=fromStore(v[k]));return a}}
  const o={};ks.forEach(k=>o[k]=fromStore(v[k]));return o;
}

  const parts=p=>(p||'').split('/').filter(Boolean);
  const getP=(d,p)=>parts(p).reduce((o,k)=>o&&typeof o==='object'?o[k]:undefined,d);
  function setP(d,p,v){const ks=parts(p);if(!ks.length)return v===undefined?{}:v;let o=d;for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]]}const l=ks[ks.length-1];if(v===undefined)delete o[l];else o[l]=v;return d}
  function prune(o){if(!o||typeof o!=='object')return o;for(const k of Object.keys(o)){o[k]=prune(o[k]);if(o[k]===undefined||(typeof o[k]==='object'&&o[k]!==null&&!Object.keys(o[k]).length))delete o[k]}return o}
  function write(ops){let d=load();for(const [p,v] of ops)d=setP(d,p,toStore(clone(v)));localStorage.setItem(K,JSON.stringify(prune(d)||{}));notify();ch&&ch.postMessage(1)}
  function notify(){const d=load();ls.slice().forEach(l=>l.fire(d))}
  if(ch)ch.onmessage=()=>notify();
  function mk(path,type,cb){const l={path,type,cb,last:undefined,seen:new Set(),fire(d){const v=getP(d,this.path);
    if(this.type==='value'){const j=JSON.stringify(v===undefined?null:v);if(j!==this.last){this.last=j;this.cb(fromStore(clone(v)))}}
    else{const o=v||{};for(const k of Object.keys(o).sort())if(!this.seen.has(k)){this.seen.add(k);this.cb(k,fromStore(clone(o[k])))}}}};

    async signOut(){setMe(null)},
    async get(p){return fromStore(clone(getP(load(),p)))},
    async set(p,v){write([[p,v]])},
    async update(p,o){write(Object.entries(o).map(([k,v])=>[(p?p+'/':'')+k,v]))},
    async remove(p){write([[p,undefined]])},
    push(p,v){const k=Date.now().toString(36)+Math.random().toString(36).slice(2,7);write([[p+'/'+k,v]]);return k},
    on(p,cb){return mk(p,'value',cb)},

    onDisc(p,v){discs=discs.filter(x=>x[0]!==p);discs.push([p,v])},

    async top(p,c,n){const o=fromStore(clone(getP(load(),p)))||{};return Object.entries(o).filter(([,v])=>v&&typeof v[c]==='number').sort((a,b)=>b[1][c]-a[1][c]).slice(0,n)},
    connected(cb){cb(true)},
    _drop(){if(discs.length)write(discs.map(([p,v])=>[p,v===null?undefined:v]));discs=[];ls.length=0}
  };

/* ---- Firebase backend ---- */
function FBNET(){
  const app=firebase.apps&&firebase.apps.length?firebase.app():firebase.initializeApp(FB_CFG);
  const au=firebase.auth(),db=firebase.database();
  const R=p=>p?db.ref(p):db.ref();
  const cl=v=>v===undefined?null:clone(v);
  return {
    onAuth(cb){au.onAuthStateChanged(u=>cb(u?{uid:u.uid}:null))},
    async signUp(e,p){const c=await au.createUserWithEmailAndPassword(e,p);return{uid:c.user.uid}},
    async signIn(e,p){const c=await au.signInWithEmailAndPassword(e,p);return{uid:c.user.uid}},
    signOut(){return au.signOut()},
    async get(p){return (await R(p).get()).val()},
    set(p,v){return R(p).set(cl(v))},
    update(p,o){const x={};for(const k in o)x[k]=cl(o[k]);return R(p).update(x)},
    remove(p){return R(p).remove()},
    push(p,v){const r=R(p).push();r.set(cl(v));return r.key},
    on(p,cb){const r=R(p),f=s=>cb(s.val());r.on('value',f);return()=>r.off('value',f)},
    onAdd(p,cb){const r=R(p),f=s=>cb(s.key,s.val());r.on('child_added',f);return()=>r.off('child_added',f)},
    onDisc(p,v){v===null?R(p).onDisconnect().remove():R(p).onDisconnect().set(cl(v))},
    cancelDisc(p){R(p).onDisconnect().cancel()},
    async top(p,c,n){const s=await R(p).orderByChild(c).limitToLast(n).get();const a=[];s.forEach(x=>{a.push([x.key,x.val()])});return a.reverse()},
    connected(cb){R('.info/connected').on('value',s=>cb(!!s.val()))}
  };
}

  if(act==='on-join'){joinRoom(a.dataset.room);return}
  if(act==='on-seat'){if(e.target.closest('[data-act="on-kick"],[data-act="on-bot"]')&&e.target.closest('[data-act]')!==a)return;seatTap(+a.dataset.seat);return}
  if(act==='on-bot'){e.stopPropagation();const s=+a.dataset.seat;NET.set(`rooms/${ON.r}/seats/${s}`,{bot:true,nick:botNick(s)});return}
  if(act==='on-kick'){e.stopPropagation();const s=+a.dataset.seat;NET.set(`rooms/${ON.r}/seats/${s}`,null);return}
  if(act==='on-start'){hostStart();return}
  if(act==='on-chat-toggle'){NET.update(`rooms/${ON.r}`,{chat:!ON.room.chat});return}
  if(act==='on-mute'){try{localStorage.setItem('belka-chatmute',chatMuted()?'0':'1')}catch(x){}if(ON.view==='room')roomView();else{closeSheet();chatBadge()}return}
  if(act==='on-leave-room'){exitRoom(false);return}
  if(act==='on-ready'){closeSheet();if(ON.seat>=0&&ON.V)NET.set(`ready/${ON.r}/${ON.seat}`,ON.V.deal);return}
  if(act==='on-again'){closeSheet();if(ON.host){HG=null;await NET.update('',{[`rooms/${ON.r}/status`]:'lobby',[`rooms/${ON.r}/state`]:null,[`hands/${ON.r}`]:null,[`ready/${ON.r}`]:null,[`moves/${ON.r}`]:null});NET.onDisc(`rooms/${ON.r}/status`,'closed')}toRoomView();return}
  if(act==='on-exit'){exitRoom(false);return}
  if(act==='on-quit'){closeSheet();exitRoom(true);return}
  if(act==='on-forfeit'){closeSheet();const a=ownProf().active;ON.resume=null;await applyQuit(a&&a.loss);lobby();return}
  if(act==='on-rejoin'){closeSheet();const r=ON.resume;ON.resume=null;enterRoom(r);return}
}
if(NET_MODE==='mock')window.__BELKA={get HG(){return HG},set HG(v){HG=v},eng,get ON(){return ON},get G(){return G},endDeal,startDeal,clearTimers};
$('#btnOnline').addEventListener('click',()=>{ac();openOnline()});
$('#btnChat').addEventListener('click',openChatSheet);

/*ONLINE-JS-END*/
/* hot reload */
function start(data){
  if(data&&data.G){
    G=data.G;$('#title').hidden=true;rebuildTrick();renderAll();
    if(G.phase==='play'){if(G.trick.length===4){later(finishTrick,300)}else next()}
    else if(G.phase==='redeal')showRedeal();
    else if(G.phase==='reveal')showReveal();
    else showResult();
  } else {showStats()}
}
window.claude?.hot?.snapshot?.(()=>({G:G?JSON.parse(JSON.stringify({...G,lock:false})):null}));
applyLang();
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
